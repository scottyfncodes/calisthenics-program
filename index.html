<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#182420">
<title>Morning Calisthenics — 12-Week Program</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Calisthenics">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#182420;
  --bg-panel:#1F2C27;
  --bg-panel-2:#26352F;
  --bg-bar:#22312B;
  --line: rgba(241,243,236,0.14);
  --line-strong: rgba(241,243,236,0.28);
  --chalk:#F1F3EC;
  --chalk-dim:#9FAC9F;
  --push:#FF8659;
  --pull:#F6D860;
  --legs:#7FD99A;
  --core:#5FB8E8;
  --full:#FF6B6B;
  --mob:#B79CF0;
  --rest:#D8D3C4;
  --cat:var(--chalk);

  /* motion: quick and intentional. --spring overshoots a touch for
     "landed" moments (check, stamp); --out is the default settle. */
  --out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.45,.64,1);
  --t-fast:140ms;
  --t:260ms;
  --t-slow:420ms;
  --bar-h:84px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 20% -10%, rgba(255,255,255,0.05), transparent 40%),
    var(--bg);
  color:var(--chalk);
  font-family:'Work Sans', sans-serif;
  min-height:100vh;
  /* leave room for the fixed now-bar so the last card is never hidden */
  padding-bottom:calc(var(--bar-h) + 40px + env(safe-area-inset-bottom));
}
button{font:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
button:focus-visible{outline:2px solid var(--chalk); outline-offset:2px;}
.wrap{max-width:640px; margin:0 auto; padding:18px 16px 40px;}

/* shared pressed state: primary controls physically give under the thumb */
.press{transition:transform var(--t-fast) var(--out), background-color var(--t) ease, border-color var(--t) ease, color var(--t) ease, box-shadow var(--t) ease;}
.press:active{transform:scale(0.95);}

/* ---- Header ---- */
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; margin-bottom:14px;}
.brand h1{
  font-family:'Oswald', sans-serif; font-weight:700; letter-spacing:0.5px;
  font-size:14px; text-transform:uppercase; color:var(--chalk-dim); margin:0;
}
.brand .tag{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--chalk-dim); opacity:0.7;}

.dayhead{
  border:1px solid var(--line-strong);
  border-radius:14px;
  padding:18px 18px 16px;
  background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
  position:relative;
  overflow:hidden;
  margin-bottom:14px;
  transition:border-color var(--t-slow) ease, background-color var(--t-slow) ease;
}
.dayhead::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(255,255,255,0.025) 28px);
  pointer-events:none;
}
.dayhead.is-done{
  border-color:color-mix(in srgb, var(--cat) 60%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb, var(--cat) 10%, transparent), transparent 70%);
}
.phaseline{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
.dayrow{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.daynum{font-family:'Oswald',sans-serif; font-weight:700; font-size:46px; line-height:1; letter-spacing:0.5px; margin:0; color:var(--chalk);}
.daysub{display:block; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--chalk-dim); font-weight:400; letter-spacing:0; margin-top:6px;}
.focusrow{display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; margin-top:12px;}
.badge{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:12px; text-transform:uppercase; white-space:nowrap;
  letter-spacing:1px; padding:5px 12px; border-radius:100px; border:1.5px solid currentColor;
}
.meta{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--chalk-dim);}

/* completion stamp: sits beside the day number, lands when the day is done */
.stamp{
  flex:0 0 auto; width:54px; height:54px; border-radius:50%; position:relative;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--cat); color:var(--cat);
  opacity:0; transform:scale(0.6) rotate(-10deg);
  transition:opacity var(--t) ease, transform var(--t) var(--out);
}
.stamp svg{width:28px; height:28px;}
.stamp path{fill:none; stroke:currentColor; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:0;}
.stamp::after{content:""; position:absolute; inset:-2px; border-radius:50%; border:2px solid var(--cat); opacity:0;}
.dayhead.is-done .stamp{opacity:1; transform:scale(1) rotate(-6deg);}
.dayhead.celebrate .stamp{animation:stampIn 560ms var(--spring) both;}
.dayhead.celebrate .stamp path{animation:drawCheck 360ms var(--out) 260ms both;}
.dayhead.celebrate .stamp::after{animation:shock 700ms var(--out) 220ms both;}
@keyframes stampIn{
  0%{opacity:0; transform:scale(1.7) rotate(-18deg);}
  55%{opacity:1; transform:scale(0.92) rotate(-5deg);}
  100%{opacity:1; transform:scale(1) rotate(-6deg);}
}
@keyframes drawCheck{from{stroke-dashoffset:1;} to{stroke-dashoffset:0;}}
@keyframes shock{0%{opacity:0.7; transform:scale(1);} 100%{opacity:0; transform:scale(1.9);}}

/* set track: one segment per set, grouped by section — reps stacking up */
.track{display:flex; gap:8px; margin-top:16px; position:relative;}
.tgroup{display:flex; gap:3px;}
.seg{flex:1; height:7px; border-radius:2px; background:rgba(241,243,236,0.09); position:relative; overflow:hidden;}
.seg::after{
  content:""; position:absolute; inset:0; background:var(--cat);
  transform:scaleX(0); transform-origin:left center;
  transition:transform 320ms var(--out);
}
.tgroup.soft .seg::after{background:color-mix(in srgb, var(--cat) 55%, var(--chalk-dim));}
.seg.on::after{transform:scaleX(1);}
.seg.pop{animation:segPop 520ms var(--out);}
@keyframes segPop{0%{transform:scaleY(1);} 35%{transform:scaleY(1.9);} 100%{transform:scaleY(1);}}
.track::after{
  content:""; position:absolute; top:-3px; bottom:-3px; left:0; width:40%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  opacity:0; transform:translateX(-120%);
}
.dayhead.celebrate .track::after{animation:sheen 900ms ease-out 120ms;}
@keyframes sheen{0%{opacity:1; transform:translateX(-120%);} 100%{opacity:1; transform:translateX(260%);}}
.trackmeta{display:flex; justify-content:space-between; gap:10px; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--chalk-dim);}
.trackmeta b{color:var(--chalk); font-weight:600;}
.tcount b{display:inline-block;}
.tcount b.bump{animation:bump 360ms var(--spring);}
@keyframes bump{0%{transform:translateY(0);} 40%{transform:translateY(-4px);} 100%{transform:translateY(0);}}

/* nav row */
.navrow{display:flex; gap:8px; margin-top:14px;}
.navbtn{
  flex:1; background:var(--bg-panel-2); border:1px solid var(--line-strong); color:var(--chalk);
  font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:12px; font-weight:600;
  min-height:44px; padding:10px 0; border-radius:9px; cursor:pointer;
}
.navbtn.complete{border-color:var(--cat); color:var(--bg); background:var(--cat);}

/* week strip */
.weekstrip{display:flex; gap:6px; margin:14px 0 18px; overflow-x:auto; padding:3px 1px 4px;}
.chip{
  flex:1 0 38px; max-width:56px; height:42px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-size:12px; border:1.5px solid var(--line-strong); color:var(--chalk-dim);
  cursor:pointer; background:var(--bg-panel); position:relative; padding:0;
}
.chip.active{border-color:var(--chalk); color:var(--chalk); background:var(--bg-panel-2); transform:translateY(-2px); box-shadow:0 6px 14px -8px rgba(0,0,0,0.8);}
.chip.active:active{transform:translateY(-2px) scale(0.95);}
.chip .tick{
  position:absolute; top:-5px; right:-5px; width:16px; height:16px; border-radius:50%;
  background:var(--cat); color:var(--bg); display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(0.3); transition:opacity var(--t) ease, transform var(--t) var(--spring);
}
.chip .tick svg{width:10px; height:10px;}
.chip .tick path{fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
.chip.done{background:color-mix(in srgb, var(--cat) 14%, var(--bg-panel));}
.chip.done .tick{opacity:1; transform:scale(1);}
.chip.done.just-done .tick{animation:tickPop 520ms var(--spring) 380ms both;}
@keyframes tickPop{0%{opacity:0; transform:scale(0.2);} 100%{opacity:1; transform:scale(1);}}

/* ---- section ---- */
.section{margin-bottom:18px;}
.sectitle{
  font-family:'Oswald',sans-serif; text-transform:uppercase; font-weight:600; font-size:13px; letter-spacing:1.5px;
  color:var(--chalk-dim); display:flex; align-items:center; gap:8px; margin:0 0 6px 4px;
}
.sectitle .dot{width:7px; height:7px; border-radius:50%; background:currentColor; transition:transform var(--t) var(--spring);}
.sectitle .secmeta{margin-left:auto; margin-right:4px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.5px; color:var(--chalk-dim); font-weight:400;}
.section.sec-done .secmeta{color:var(--cat);}
.circuitinfo{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--chalk-dim); margin-left:4px; margin-bottom:9px;}

.exlist{display:flex; flex-direction:column; gap:8px;}
.exrow{
  --accent:var(--cat);
  border:1px solid var(--line); border-radius:12px; background:var(--bg-panel);
  overflow:hidden; position:relative;
  transition:border-color var(--t) ease, background-color var(--t) ease, box-shadow var(--t) ease, opacity var(--t) ease;
}
/* accent rail on the left edge: grows in on the current move */
.exrow::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);
  transform:scaleY(0); transform-origin:center; transition:transform var(--t-slow) var(--out); z-index:1;
}
/* completion sweep: a band of color wipes across when a move is finished */
.exrow::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 22%, transparent) 60%, transparent);
  transform:translateX(-100%); opacity:0;
}
.exrow.is-current{
  border-color:color-mix(in srgb, var(--accent) 55%, transparent);
  background:var(--bg-panel-2);
  box-shadow:0 10px 24px -14px rgba(0,0,0,0.85), 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
}
.exrow.is-current::before{transform:scaleY(1);}
.exrow.became-current{animation:liftIn 420ms var(--out);}
@keyframes liftIn{0%{transform:translateY(6px) scale(0.985);} 100%{transform:none;}}
.exrow.is-done{background:color-mix(in srgb, var(--accent) 7%, var(--bg-panel)); border-color:color-mix(in srgb, var(--accent) 22%, transparent);}
.exrow.is-done .exname{opacity:0.62;}
.exrow.just-done::after{animation:sweep 620ms var(--out);}
@keyframes sweep{0%{opacity:1; transform:translateX(-100%);} 100%{opacity:1; transform:translateX(100%);}}

.exhead{display:flex; align-items:stretch;}
.extoggle{
  flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 6px 12px 14px; background:none; border:0; text-align:left; cursor:pointer;
}
.exmain{display:flex; flex-direction:column; min-width:0;}
.exname{font-family:'Work Sans',sans-serif; font-weight:600; font-size:15px; transition:opacity var(--t) ease;}
.exsub{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--chalk-dim); margin-top:3px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.nowtag{
  font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; font-weight:600;
  color:var(--bg); background:var(--accent); padding:1px 7px; border-radius:4px; display:none;
}
.exrow.is-current .nowtag{display:inline-block; animation:fadeUp 300ms var(--out) both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}
.pips{display:inline-flex; gap:3px; vertical-align:middle;}
.pips i{width:12px; height:4px; border-radius:2px; background:rgba(241,243,236,0.16); position:relative; overflow:hidden;}
.pips i::after{content:""; position:absolute; inset:0; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform 300ms var(--out);}
.pips i.on::after{transform:scaleX(1);}
.exchev{color:var(--chalk-dim); font-size:12px; transition:transform var(--t) var(--out); flex:0 0 auto;}
.exrow.open .exchev{transform:rotate(180deg);}

/* check button: ring fills per logged round, check draws in on completion */
.check{
  flex:0 0 auto; width:60px; min-height:56px; background:none; border:0; border-left:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; padding:0;
}
.ck{width:34px; height:34px; position:relative; display:block; transition:transform var(--t-fast) var(--out);}
.check:active .ck{transform:scale(0.86);}
.ck svg{width:34px; height:34px; display:block; transform:rotate(-90deg);}
.ck .ck-bg{fill:transparent; transition:fill var(--t) ease;}
.ck .ck-track{fill:none; stroke:var(--line-strong); stroke-width:2;}
.ck .ck-ring{fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:1 1; stroke-dashoffset:1; transition:stroke-dashoffset 380ms var(--out), opacity var(--t-fast) ease;}
.ck .ck-mark{position:absolute; inset:0; width:34px; height:34px; transform:none;}
.ck .ck-mark path{fill:none; stroke:var(--bg); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1 1; stroke-dashoffset:1; transition:stroke-dashoffset 260ms var(--out);}
.ck .ck-count{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--chalk-dim); transition:opacity var(--t-fast) ease;}
.exrow.is-current .ck .ck-count{color:var(--chalk);}
.exrow.is-done .ck .ck-bg{fill:var(--accent);}
.exrow.is-done .ck .ck-mark path{stroke-dashoffset:0; transition-delay:120ms;}
.exrow.is-done .ck .ck-count{opacity:0;}
.exrow.just-logged .ck{animation:ckPop 460ms var(--spring);}
@keyframes ckPop{0%{transform:scale(0.8);} 60%{transform:scale(1.12);} 100%{transform:scale(1);}}

/* expand / collapse: grid 0fr→1fr animates to the content's real height */
.exbody{display:grid; grid-template-rows:0fr; transition:grid-template-rows 300ms var(--out);}
.exclip{overflow:hidden; min-height:0;}
.exrow.open .exbody{grid-template-rows:1fr;}
.exinner{
  padding:0 14px 16px; display:flex; gap:14px; align-items:center; border-top:1px solid var(--line);
  opacity:0; transform:translateY(-6px); transition:opacity 200ms ease, transform 300ms var(--out);
}
.exrow.open .exinner{opacity:1; transform:none;}
.stagebox{
  width:110px; height:110px; flex:0 0 auto; border-radius:10px; background:var(--bg);
  display:flex; align-items:center; justify-content:center; margin-top:12px;
}
.stagebox svg{width:88px; height:88px; overflow:visible;}
.cuecol{padding-top:12px;}
.cue{font-size:13.5px; line-height:1.45; color:var(--chalk); opacity:0.92;}
.timerbtn{
  margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:12px; background:transparent;
  border:1.5px solid var(--line-strong); color:var(--chalk); min-height:36px; padding:6px 14px; border-radius:100px; cursor:pointer;
}
.timerbtn.running{border-color:var(--accent); color:var(--accent);}

/* figure: drawn each frame by the kinematic rig in the script (see drawFig) */
.fig path{fill:none; stroke:var(--chalk); stroke-width:5; stroke-linecap:round; stroke-linejoin:round;}
.fig .head{fill:var(--chalk);}
/* far-side arm and leg in side views, so near and far limbs stay readable */
.fig .far{opacity:0.42;}
/* ground reference line; it scrolls (dashes) when the figure travels */
.fig .floor{stroke:var(--chalk-dim); stroke-width:1.5; opacity:0.45; stroke-linecap:butt;}
.fig .floor.ticks{stroke-dasharray:4 4; opacity:0.7;}
.fig .bar{stroke:var(--chalk-dim); stroke-width:2; opacity:0.6;}
.fig .mat{fill:none; stroke:var(--chalk-dim); stroke-width:1.5; opacity:0.45;}

/* page entrance when the day changes: content slides in from the
   direction you navigated, rows settle in a quick stagger */
.wrap.enter .dayhead, .wrap.enter .weekstrip{animation:slideIn 380ms var(--out) backwards;}
.wrap.enter .sectitle, .wrap.enter .circuitinfo, .wrap.enter .exrow, .wrap.enter .footnote{animation:rowIn 400ms var(--out) backwards; animation-delay:calc(var(--i, 0) * 30ms + 60ms);}
.wrap[data-dir="next"]{--from:14px;}
.wrap[data-dir="prev"]{--from:-14px;}
@keyframes slideIn{from{opacity:0; transform:translateX(var(--from, 0)) translateY(var(--rise, 0));}}
@keyframes rowIn{from{opacity:0; transform:translateY(10px);}}

/* ---- now bar: what am I doing, how long, what's next ---- */
.nowbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20; pointer-events:none;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));
}
.nb{
  pointer-events:auto; max-width:620px; margin:0 auto; min-height:var(--bar-h);
  display:flex; align-items:center; gap:12px; padding:10px 10px 10px 12px;
  background:var(--bg-bar); border:1px solid var(--line-strong); border-radius:16px;
  box-shadow:0 14px 34px -12px rgba(0,0,0,0.9), 0 -1px 0 rgba(255,255,255,0.04) inset;
  transform:translateY(calc(100% + 24px)); transition:transform var(--t-slow) var(--out), border-color var(--t) ease;
}
.nowbar.show .nb{transform:none;}
.nowbar[data-phase="work"] .nb{border-color:color-mix(in srgb, var(--cat) 70%, transparent);}
.nowbar[data-phase="done"] .nb{border-color:color-mix(in srgb, var(--cat) 55%, transparent);}
.nb-ring{
  flex:0 0 auto; width:58px; height:58px; position:relative; background:none; border:0; padding:0; cursor:pointer;
  border-radius:50%;
}
.nb-ring svg{width:58px; height:58px; display:block; transform:rotate(-90deg);}
.nb-ring .rg-track{fill:none; stroke:rgba(241,243,236,0.12); stroke-width:4;}
.nb-ring .rg-arc{fill:none; stroke:var(--cat); stroke-width:4; stroke-linecap:round; stroke-dasharray:1 1; stroke-dashoffset:0; transition:stroke-dashoffset 250ms linear, stroke var(--t) ease;}
.nb-ring .rg-fill{fill:transparent; transition:fill var(--t) ease;}
.nowbar[data-phase="rest"] .rg-arc{stroke:var(--chalk-dim);}
.nowbar[data-phase="done"] .rg-fill{fill:var(--cat);}
.nb-num{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:18px; color:var(--chalk); font-variant-numeric:tabular-nums;
}
.nb-num svg{width:22px; height:22px; transform:none;}
.nb-num path{fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
.nb-num .play{fill:currentColor; stroke:none;}
.nowbar[data-phase="done"] .nb-num{color:var(--bg);}
.nowbar[data-phase="ready"] .nb-num, .nowbar[data-phase="rest"] .nb-num{color:var(--chalk);}
.nb-ring.tick{animation:ringTick 420ms var(--out);}
@keyframes ringTick{0%{transform:scale(1);} 30%{transform:scale(1.08);} 100%{transform:scale(1);}}
.nb-text{flex:1; min-width:0;}
.nb-text.swap{animation:fadeUp 320ms var(--out);}
.nb-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--chalk-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.nowbar[data-phase="work"] .nb-label, .nowbar[data-phase="done"] .nb-label{color:var(--cat);}
.nb-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; line-height:1.15; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
.nb-action{
  flex:0 0 auto; min-width:92px; min-height:52px; padding:0 16px; border-radius:12px; cursor:pointer;
  font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:1px; text-transform:uppercase;
  background:var(--cat); color:var(--bg); border:1.5px solid var(--cat);
}
.nb-action.ghost{background:transparent; color:var(--chalk); border-color:var(--line-strong);}
.nb-action[hidden]{display:none;}
/* rest just ended: nudge the user to go */
.nowbar.go .nb-action{animation:goPulse 1.2s var(--out) 2;}
@keyframes goPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--cat) 70%, transparent);} 100%{box-shadow:0 0 0 14px transparent;}}

/* toast: confirms a logged set and offers undo for stray taps */
.toast{
  position:fixed; left:50%; z-index:30; bottom:calc(var(--bar-h) + 22px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px; max-width:calc(100% - 32px);
  padding:8px 8px 8px 14px; border-radius:10px; background:var(--chalk); color:var(--bg);
  font-size:13px; font-weight:500; box-shadow:0 10px 24px -10px rgba(0,0,0,0.8);
  transform:translate(-50%, 12px); opacity:0; pointer-events:none;
  transition:opacity 200ms ease, transform 300ms var(--out);
}
.toast.show{opacity:1; transform:translate(-50%, 0); pointer-events:auto;}
.toast span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.toast button{
  flex:0 0 auto; background:transparent; border:1.5px solid rgba(24,36,32,0.35); border-radius:7px; min-height:34px; padding:0 12px;
  font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
}

@media (hover:hover){
  .navbtn:hover, .chip:hover{border-color:var(--chalk-dim);}
  .extoggle:hover .exname{text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px;}
  .check:hover .ck-track{stroke:var(--chalk-dim);}
}

/* Respect the OS "reduce motion" setting: the demo is drawn still at its
   key position (the script skips the animation loop), and drop movement from state changes.
   Every state is still conveyed by color, fill and text. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:1ms !important; animation-iteration-count:1 !important; animation-delay:0ms !important;
    transition-duration:1ms !important; transition-delay:0ms !important;
  }
  .exrow::after, .track::after{display:none;}
  .chip.active{transform:none;}
}

/* footer note */
.footnote{
  margin-top:22px; padding:14px 16px; border:1px dashed var(--line-strong); border-radius:12px;
  font-size:12.5px; color:var(--chalk-dim); line-height:1.5;
}
.footnote b{color:var(--chalk);}

::-webkit-scrollbar{height:6px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:10px;}

/* category color utility classes set via inline style using CSS var --cat */
.badge, .sectitle, .chip.cat{color:var(--cat);}
.chip.cat.active{background:color-mix(in srgb, var(--cat) 20%, var(--bg-panel));}
.chip.cat.done{color:var(--cat);}

@media (max-width:360px){
  .daynum{font-size:40px;}
  .dayhead{padding:16px 14px 14px;}
  .navbtn{font-size:11px; letter-spacing:0.5px; white-space:nowrap;}
  .chip{flex-basis:32px;}
  .weekstrip{gap:5px;}
  .nb{gap:10px;}
  .nb-action{min-width:80px; padding:0 12px;}
  .nb-name{font-size:17px;}
  .nb-label{letter-spacing:0.3px;}
}
</style>

<script>
/* =========================================================
   DATA: exercise library — {name, type(animation), cue}
   ========================================================= */
const EX = {
  // warm-up
  armCircles:{name:"Arm Circles", type:"armcircle", cue:"Stand tall, sweep arms in big slow circles. Reverse direction halfway through."},
  shoulderRolls:{name:"Shoulder Rolls", type:"shoulderroll", cue:"Small circles at the shoulder — loosen the joint before loading it."},
  jumpingJacksLight:{name:"March in Place", type:"march", cue:"Easy march, arms swinging — raise the heart rate gently before Day 1 work."},
  jumpingJacks:{name:"Jumping Jacks", type:"jumpingjack", cue:"Full jack — feet and arms open together, land soft on the balls of your feet."},
  hipCircles:{name:"Hip Circles", type:"hipcircle", cue:"Hands on hips, trace a big slow circle at the hip in both directions."},
  highKneesLight:{name:"High Knees (easy)", type:"highkneeseasy", cue:"Light jog on the spot, knees to hip height, relaxed pace."},
  highKnees:{name:"High Knees", type:"highknees", cue:"Drive knees up fast to hip height, stay on the balls of your feet, arms pumping."},

  // push

  kneePushup:{name:"Knee Push-up", type:"kneepushup", cue:"Knees down, straight line from knee to head. Lower chest to the floor."},
  pushup:{name:"Push-up", type:"pushup", cue:"Hands under shoulders, body rigid plank. Chest to floor, drive back up."},
  pikePushup:{name:"Pike Push-up", type:"pike", cue:"Hips high, forming an upside-down V. Lower the top of your head toward the floor."},
  diamondPushup:{name:"Diamond Push-up", type:"diamondpushup", cue:"Hands together under chest, thumbs and index fingers touching. Lower with elbows tucked."},
  archerPushup:{name:"Archer Push-up", type:"archerpushup", cue:"Wide hands, shift weight to one side as you lower, straight arm stays extended."},

  // legs

  gluteBridge:{name:"Glute Bridge", type:"glutebridge", cue:"Lie on your back, knees bent. Squeeze glutes and lift hips to a straight line."},
  calfRaise:{name:"Calf Raise", type:"calfraise", cue:"Stand tall, rise onto the balls of both feet, pause, lower slow."},

  walkingLunge:{name:"Walking Lunge", type:"walklunge", cue:"Step forward into a lunge, drive up and step the back foot through into the next lunge."},
  pistolSquat:{name:"Assisted Pistol Squat", type:"pistol", cue:"One leg extended forward, hold a doorframe for balance, lower slow onto the standing leg."},
  jumpLunge:{name:"Jump Lunge", type:"jumplunge", cue:"From a lunge, jump and switch legs mid-air, land soft into the opposite lunge."},

  // core
  deadBug:{name:"Dead Bug", type:"deadbug", cue:"On your back, arms up, knees at 90°. Lower opposite arm and leg without arching your low back."},
  birdDog:{name:"Bird Dog", type:"birddog", cue:"All fours, extend opposite arm and leg fully, hold, keep hips square."},
  kneePlank:{name:"Knee Plank", type:"kneeplank", cue:"Forearms and knees down, one straight line from knees to head. Brace the core."},
  plank:{name:"Plank", type:"plank", cue:"Forearms and toes down, one straight line from ankles to head. Squeeze glutes and abs."},
  bicycleCrunch:{name:"Bicycle Crunch", type:"crunch", cue:"Hands behind head, bring opposite elbow to opposite knee in a slow pedal."},

  sidePlank:{name:"Side Plank", type:"sideplank", cue:"One forearm down, stack your feet, lift hips into a straight line. Switch sides at the halfway point."},

  // pull
  superman:{name:"Superman", type:"superman", cue:"Lie face down, lift arms, chest and legs off the floor together, hold, lower slow."},
  reverseSnowAngel:{name:"Reverse Snow Angel", type:"snowangel", cue:"Face down, arms hovering just off the floor, sweep them straight from your hips out and up overhead, then back."},
  proneYRaise:{name:"Prone Y-Raise", type:"yraise", cue:"Face down, arms forming a Y overhead, lift them off the floor squeezing your upper back."},
  towelRow:{name:"Towel Row", type:"row", cue:"Loop a towel around a sturdy post, lean back, pull your chest to your hands."},
  tableRow:{name:"Table Row", type:"tablerow", cue:"Lie under a sturdy table, grip the edge, pull your chest up to the table."},
  scapularSqueeze:{name:"Scapular Squeeze Hold", type:"scapsqueeze", cue:"Arms at your sides, squeeze your shoulder blades together and hold."},
  archerTableRow:{name:"Archer Table Row", type:"archertablerow", cue:"Table row, but pull mostly with one arm while the other stays lighter."},

  // full body / conditioning
  stepBackBurpee:{name:"Step-Back Burpee", type:"burpeestep", cue:"Hands down, step feet back to a plank one at a time, step back in, stand up."},
  halfBurpee:{name:"Half Burpee", type:"halfburpee", cue:"Hands down, jump feet back to a plank, jump them back in, stand up (no push-up, no jump)."},
  burpee:{name:"Burpee", type:"burpee", cue:"Squat, hands down, jump back to plank, push-up, jump feet in, jump up reaching overhead."},
  burpeeTuckJump:{name:"Burpee Tuck Jump", type:"burpeetuck", cue:"Full burpee, finish with a jump and pull both knees up toward your chest."},
  bearCrawlHold:{name:"Bear Crawl Hold", type:"bearhold", cue:"Hands and toes down, knees hovering an inch off the floor. Hold, breathe."},
  bearCrawl:{name:"Bear Crawl", type:"bearcrawl", cue:"Knees hovering, crawl forward moving opposite hand and foot together."},
  starJump:{name:"Star Jump", type:"starjump", cue:"Squat slightly then jump, throwing arms and legs out into a star shape."},

  // mobility / rest
  worldsGreatest:{name:"World's Greatest Stretch", type:"kneelrotate", cue:"Lunge forward, drop the back knee, plant both hands inside the front foot, rotate one arm to the sky."},
  thoracicRotation:{name:"Thoracic Rotation", type:"quadreach", cue:"All fours, one hand behind your head, rotate your elbow down then up toward the ceiling."},
  standingFold:{name:"Standing Forward Fold", type:"fold", cue:"Feet hip-width, hinge at the hips and let your head hang heavy, soft knees."},
  childsPose:{name:"Child's Pose", type:"childspose", cue:"Kneel, sit hips to heels, walk hands forward and let your chest sink toward the floor."},
  hamstringStretch:{name:"Hamstring Stretch", type:"hamstring", cue:"Seated or standing, straighten one leg, hinge forward from the hips, chest toward the shin."},
  hipFlexorStretch:{name:"Hip Flexor Stretch", type:"kneelunge", cue:"Kneeling lunge, tuck your tailbone under and gently shift your hips forward."},
  chestOpener:{name:"Chest Opener Stretch", type:"chestopener", cue:"Clasp hands behind your back, lift your chest, gently pull shoulders down and back."},
  threadNeedle:{name:"Thread the Needle", type:"quadthread", cue:"All fours, thread one arm under the other, rest your shoulder and ear on the floor."},
  quadStretch:{name:"Quad Stretch", type:"quadhold", cue:"Standing, hold one ankle behind you, knees together, hips pushed slightly forward."}
};

/* =========================================================
   CATEGORY META
   ========================================================= */
const CAT = {
  PUSH:{label:"Push", css:"--push"},
  LEGS:{label:"Legs", css:"--legs"},
  CORE:{label:"Core", css:"--core"},
  PULL:{label:"Pull", css:"--pull"},
  FULL:{label:"Full Body", css:"--full"},
  MOB:{label:"Mobility", css:"--mob"},
  REST:{label:"Recovery", css:"--rest"}
};

/* =========================================================
   PHASES — each has a 7-day template. Exercise lists vary
   by phase (progression); rest/mobility days stay constant.
   ========================================================= */
const PHASES = [
  {
    name:"Foundation", weeks:"Weeks 1–3",
    blurb:"Learn the positions. Easier variants, longer rest, focus on strict form over speed.",
    days:{
      1:{cat:"PUSH", circuit:["inclinePushup","kneePushup","pikePushup"]},
      2:{cat:"LEGS", circuit:["squat","gluteBridge","calfRaise"]},
      3:{cat:"CORE", circuit:["deadBug","birdDog","kneePlank"]},
      4:{cat:"PULL", circuit:["superman","reverseSnowAngel","proneYRaise"]},
      5:{cat:"FULL", circuit:["stepBackBurpee","highKneesLight","bearCrawlHold"]},
    }
  },
  {
    name:"Building", weeks:"Weeks 4–6",
    blurb:"Standard bodyweight strength. Full range push-ups and squats, more reps per round.",
    days:{
      1:{cat:"PUSH", circuit:["pushup","pikePushup","kneePushup"]},
      2:{cat:"LEGS", circuit:["squat","reverseLunge","gluteBridgeMarch"]},
      3:{cat:"CORE", circuit:["plank","deadBug","bicycleCrunch"]},
      4:{cat:"PULL", circuit:["superman","towelRow","reverseSnowAngel"]},
      5:{cat:"FULL", circuit:["halfBurpee","highKneesLight","bearCrawl"]},
    }
  },
  {
    name:"Strength", weeks:"Weeks 7–9",
    blurb:"Harder leverage and single-leg work. Shorter rest, more time under tension.",
    days:{
      1:{cat:"PUSH", circuit:["pushup","diamondPushup","pikePushup"]},
      2:{cat:"LEGS", circuit:["jumpSquat","bulgarianSplitSquat","walkingLunge"]},
      3:{cat:"CORE", circuit:["plank","mountainClimbers","sidePlank"]},
      4:{cat:"PULL", circuit:["tableRow","superman","scapularSqueeze"]},
      5:{cat:"FULL", circuit:["burpee","mountainClimbers","jumpingJacks"]},
    }
  },
  {
    name:"Performance", weeks:"Weeks 10–12",
    blurb:"Advanced variants and explosive power. Highest intensity, shortest rest.",
    days:{
      1:{cat:"PUSH", circuit:["archerPushup","diamondPushup","pseudoPlanchePushup"]},
      2:{cat:"LEGS", circuit:["pistolSquat","jumpLunge","bulgarianSplitSquat"]},
      3:{cat:"CORE", circuit:["hollowBody","vUp","mountainClimbers"]},
      4:{cat:"PULL", circuit:["archerTableRow","superman","towelRow"]},
      5:{cat:"FULL", circuit:["burpeeTuckJump","bearCrawl","starJump"]},
    }
  }
];

const WARMUPS = {
  1:["armCircles","jumpingJacksLight"], 2:["hipCircles","highKneesLight"],
  3:["catCow","birdDogWarm"], 4:["armCircles","shoulderRolls"], 5:["jumpingJacksLight","highKneesLight"]
};
const COOLDOWNS = {
  1:["chestOpener","childsPose"], 2:["quadStretch","hamstringStretch"],
  3:["childsPose","catCow"], 4:["chestOpener","threadNeedle"], 5:["hamstringStretch","childsPose"]
};
const MOBILITY_DAY = ["catCow","hipCircles","worldsGreatest","thoracicRotation","standingFold"];
const REST_DAY = ["childsPose","catCow","hamstringStretch","hipFlexorStretch","chestOpener","threadNeedle","standingFold"];

const WORK_BASE  = [30,35,40,45];
const REST_BASE  = [25,20,15,15];

/* =========================================================
   BUILD a workout object for absolute day (1..84)
   ========================================================= */
function getWorkout(day){
  const week = Math.ceil(day/7);            // 1..12
  const dow  = ((day-1)%7)+1;                // 1..7
  const phaseIdx = Math.floor((week-1)/3);   // 0..3
  const weekInPhase = (week-1)%3;            // 0..2
  const phase = PHASES[phaseIdx];

  if(dow===6){
    return {phase, week, dow, cat:"MOB", flow:MOBILITY_DAY, flowSec:150,
      title:"Mobility Flow", note:"A slow, deliberate flow. No circuit today — just move well."};
  }
  if(dow===7){
    return {phase, week, dow, cat:"REST", flow:REST_DAY, flowSec:120,
      title:"Recovery Stretch", note:"Rest day. Optional light flow to stay loose for tomorrow."};
  }

  const d = phase.days[dow];
  const workSec = WORK_BASE[phaseIdx] + weekInPhase*5;
  const restSec = Math.max(10, REST_BASE[phaseIdx] - weekInPhase*5);
  return {
    phase, week, dow, cat:d.cat,
    title:CAT[d.cat].label+" Day",
    warmup:WARMUPS[dow], cooldown:COOLDOWNS[dow],
    circuit:d.circuit, rounds:3, workSec, restSec
  };
}

/* =========================================================
   STORAGE (persist current day + completed days)
   ========================================================= */
let state = {day:1, completed:{}, sets:{}};
const STORAGE_KEY = 'cal-program-state';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ /* no saved state yet */ }
  // older saves only had {day, completed}; sets (per-move logging) is new
  if(!state || typeof state!=='object') state = {};
  const day = parseInt(state.day, 10);
  state.day = day>=1 && day<=84 ? day : 1;
  if(!state.completed || typeof state.completed!=='object') state.completed = {};
  if(!state.sets || typeof state.sets!=='object') state.sets = {};
  render();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* =========================================================
   STICK FIGURE — kinematic rig
   ========================================================= */
/* FIGURE ENGINE START */
/* One skeleton for every exercise. Bones have fixed lengths, so a figure can
   never stretch, shrink or come apart; each move is a set of key poses and
   the rig is solved per frame:
   - joints are placed by forward kinematics from the hip, or
   - a hand or foot that is planted on something is given as a fixed target
     and the elbow/knee is solved (two-bone IK), so contacts don't slide.
   Coordinates are SVG user units (y down), angles in degrees (0 = +x,
   90 = straight down). Side views are drawn with the far-side limbs dimmed.
   "face" is the body's handedness on screen: +1 for a figure standing and
   facing right (or that pose rotated: supine head-left, prone head-right),
   -1 for its mirror image. Knees and elbows bend the correct way round for
   that frame, and scripts/check.js verifies it for every frame of every move. */
const BONE = {torso:25, neck:9, headR:6.5, ua:14, fa:16, th:19, sh:19, ft:6};
const ARM = BONE.ua + BONE.fa, LEG = BONE.th + BONE.sh;
const FLOOR = 90, G = 87.5;            // G: centre line of a limb resting on the floor
const HEAD_DOWN = FLOOR - BONE.headR;  // head centre when the head rests on the floor
const STAND = G - LEG + 0.5;           // standing hip height, knees soft (never locked)

const D2R = Math.PI/180;
const dir = a => [Math.cos(a*D2R), Math.sin(a*D2R)];
const add = (p, a, len) => { const v = dir(a); return [p[0]+v[0]*len, p[1]+v[1]*len]; };
const ang = (a, b) => Math.atan2(b[1]-a[1], b[0]-a[0])/D2R;
const dist = (a, b) => Math.hypot(b[0]-a[0], b[1]-a[1]);
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const lerp = (a, b, k) => a + (b-a)*k;
const wrap = a => ((a % 360) + 540) % 360 - 180;
const lerpAng = (a, b, k) => a + wrap(b-a)*k;
// bisection root-finder for the geometry helpers below (fn must change sign on [lo,hi])
function solve(fn, lo, hi){
  let flo = fn(lo);
  for(let i=0;i<48;i++){ const mid=(lo+hi)/2, fm=fn(mid); if((fm<0)===(flo<0)){ lo=mid; flo=fm; } else hi=mid; }
  return (lo+hi)/2;
}
// two-bone IK: root, target, bone lengths, bend side s (+1/-1) -> [upper, lower] angles
function ikAngles(root, target, a, b, s){
  const d = clamp(dist(root, target), Math.abs(a-b)+0.01, a+b-0.001);
  const base = ang(root, target);
  const A = Math.acos(clamp((a*a + d*d - b*b)/(2*a*d), -1, 1))/D2R;
  const u = base + s*A, m = add(root, u, a);
  return [u, ang(m, target)];
}
// circle-circle intersection: the higher (smaller y) point at distance ra from A and rb from B
function meetUp(A, ra, B, rb){
  const d = dist(A, B), x = (ra*ra - rb*rb + d*d)/(2*d), h = Math.sqrt(Math.max(0, ra*ra - x*x));
  const ux = (B[0]-A[0])/d, uy = (B[1]-A[1])/d;
  const p1 = [A[0] + ux*x - uy*h, A[1] + uy*x + ux*h], p2 = [A[0] + ux*x + uy*h, A[1] + uy*x - ux*h];
  return p1[1] < p2[1] ? p1 : p2;
}

/* Rigid straight body (plank line) from a planted toe or ankle. al = direction
   from the feet toward the head. Returns params for the hip, torso and legs. */
function plankFromToe(toe, al, face){
  const fd = al + 90*face, ank = add(toe, fd, -BONE.ft);
  return plankFromAnkle(ank, al, fd);
}
function plankFromAnkle(ank, al, fd){
  const H = add(ank, al, LEG);
  return {hx:H[0], hy:H[1], t:al, 'lN.u':al+180, 'lN.l':al+180, 'lF.u':al+180, 'lF.l':al+180, 'lN.f':fd, 'lF.f':fd};
}
const shoulderOf = p => add([p.hx, p.hy], p.t, BONE.torso);
// body line from a kneeling knee: knee on the floor, hip and shoulders in line with it
function plankFromKnee(K, al, shin){
  const H = add(K, al, BONE.th);
  return {hx:H[0], hy:H[1], t:al, 'lN.u':al+180, 'lN.l':shin, 'lF.u':al+180, 'lF.l':shin};
}
// find the body angle that puts the shoulder at height y (pivoting on the feet)
const alForShoulderY = (mk, y, lo, hi) => solve(al => shoulderOf(mk(al))[1] - y, lo, hi);
const alForReach = (mk, P, d, lo, hi) => solve(al => dist(shoulderOf(mk(al)), P) - d, lo, hi);

// ---- key-pose helpers ----
const L = (id, u, l) => ({[id+'.u']:u, [id+'.l']:l===undefined ? u : l});         // limb by angles
const T = (id, x, y, extra) => Object.assign({[id+'.x']:x, [id+'.y']:y}, extra);  // limb end target
const K = (at, ...o) => Object.assign({}, ...o, {_t:at});                           // key pose at phase `at`
const both = (u, l) => Object.assign(L('aN', u, l), L('aF', u, l));
const legsTo = (xN, yN, xF, yF) => Object.assign(T('lN', xN, yN), T('lF', xF, yF));
const toeAt = (id, x, y, f) => ({[id+'.tx']:x, [id+'.ty']:y, [id+'.f']:f});    // foot placed by its toe
const EASE = {
  io: k => 0.5 - 0.5*Math.cos(Math.PI*k),
  lin: k => k,
  out: k => Math.sin(k*Math.PI/2),
  in: k => 1 - Math.cos(k*Math.PI/2),
};

/* Every key holds the full parameter set (missing values are carried
   forward from the previous key), so interpolation is a plain lerp. */
function prepKeys(def){
  if(def._keys || !def.keys) return;
  const names = new Set(); def.keys.forEach(k => Object.keys(k).forEach(n => n!=='_t' && n!=='e' && names.add(n)));
  let prev = {};
  const filled = def.keys.map(k => (prev = Object.assign({}, prev, k)));
  // anything a later key introduces is back-filled into the earlier keys
  for(let i=filled.length-2;i>=0;i--) names.forEach(n => { if(filled[i][n]===undefined) filled[i][n] = filled[i+1][n]; });
  def._keys = filled;
}
function sample(def, ph){
  if(def.proc) return def.proc(ph);
  prepKeys(def);
  const ks = def._keys, n = ks.length;
  let i = n-1;
  for(let j=0;j<n;j++){ if(ks[j]._t > ph){ i = j-1; break; } }
  if(i<0) i = n-1;
  const a = ks[i], b = ks[(i+1)%n];
  const t1 = i===n-1 ? 1 + ks[0]._t : b._t;
  const span = t1 - a._t;
  const k = span>0 ? (EASE[a.e||'io'])(clamp((ph - a._t)/span, 0, 1)) : 0;
  const p = {};
  for(const name in a){ if(name==='_t'||name==='e') continue;
    const va = a[name], vb = b[name];
    p[name] = (typeof va==='number' && typeof vb==='number') ? lerp(va, vb, k) : va;
  }
  return p;
}

function solveLimb(p, id, root, a, b, s, view){
  const g = k => p[id+'.'+k];
  if(g('pts')) return {pts:g('pts'), proj:true};
  const kk = g('k')===undefined ? 1 : g('k');
  a *= kk; b *= kk;
  if(g('tx')!==undefined){ const an = add([g('tx'), g('ty')], g('f'), -BONE.ft); p[id+'.x'] = an[0]; p[id+'.y'] = an[1]; }
  const tx = g('x');
  if(tx!==undefined && (g('str') || ((view==='front'||view==='top') && id[0]==='l'))){
    // out-of-plane limb: drawn straight to its target (foreshortened)
    const T2 = [tx, g('y')], d = Math.min(dist(root, T2), a+b), an = ang(root, T2);
    const m = add(root, an, d*a/(a+b));
    return {pts:[root, m, add(root, an, d)], u:an, l:an, T:T2, proj:true};
  }
  let u = g('u'), l = g('l');
  let T2 = null;
  if(tx!==undefined){
    T2 = [tx, g('y')];
    const w = g('w')===undefined ? 1 : g('w');
    const sg = g('s')===undefined ? s : g('s');
    const [iu, il] = ikAngles(root, T2, a, b, sg);
    if(u===undefined || w>=1){ u = iu; l = il; }
    else if(w>0){ u = lerpAng(u, iu, w); l = lerpAng(l, il, w); }
    if(w<1) T2 = null;   // only a fully weighted target is a contact
  }
  if(l===undefined) l = u;
  const m = add(root, u, a), e = add(m, l, b);
  return {pts:[root, m, e], u, l, T:T2, proj:kk<1};
}

function pose(def, ph){
  let p = sample(def, ph);
  if(def.pre) p = def.pre(p, ph) || p;
  const face = def.face===undefined ? 1 : def.face, view = def.view || 'side';
  const sg = Object.assign({aN:face, aF:face, lN:-face, lF:-face}, def.sgn);
  const H = [p.hx, p.hy], S = add(H, p.t, BONE.torso);
  const head = add(S, p.t + (p.n||0), BONE.neck);
  let rN = S, rF = S;
  if(p.sx || p.sy) rN = rF = [S[0]+(p.sx||0), S[1]+(p.sy||0)];
  if(def.bar){ rN = add(S, p.bt||0, def.bar/2); rF = add(S, p.bt||0, -def.bar/2); }
  const out = {H, S, head, c:p.c||0, cam:p.cam||0, face, view, p, rN, rF, limbs:{}};
  out.limbs.aN = solveLimb(p, 'aN', rN, BONE.ua, BONE.fa, sg.aN, view);
  out.limbs.aF = solveLimb(p, 'aF', rF, BONE.ua, BONE.fa, sg.aF, view);
  out.limbs.lN = solveLimb(p, 'lN', H, BONE.th, BONE.sh, sg.lN, view);
  out.limbs.lF = solveLimb(p, 'lF', H, BONE.th, BONE.sh, sg.lF, view);
  ['lN','lF'].forEach(id => {
    const lb = out.limbs[id];
    if(view!=='side' || def.nofeet || lb.l===undefined) return;
    const f = p[id+'.f']!==undefined ? p[id+'.f'] : lb.l - 90*face;   // default: neutral ankle
    lb.f = f; lb.toe = add(lb.pts[2], f, BONE.ft);
  });
  return out;
}

function swingLegs(p, x, lift, plantUp){
  // stance foot planted (flat, or on the ball of the foot when plantUp is set);
  // the swinging leg moves in joint space from its planted angles to the lifted ones
  const pf = plantUp || 0, toe = [x + BONE.ft*Math.cos(0), G], A = plantUp ? add([x+4, G], pf, -BONE.ft) : [x, G];
  ['lN','lF'].forEach(id => {
    const k = p[id];
    const [u0, l0] = ikAngles([p.hx, p.hy], A, BONE.th, BONE.sh, -1);
    if(k<=0){ Object.assign(p, T(id, ...A), {[id+'.f']:pf}); return; }
    Object.assign(p, L(id, lerpAng(u0, lift.u, k), lerpAng(l0, lift.l, k)), {[id+'.f']:lerp(pf, lift.f, k)});
  });
  return p;
}
function quadDef(sx){
  return {face:-1, keys:[K(0,{})], pre:p => quadPre(p, sx), pins:[['lN.knee'],['lF.knee']]};
}
// all fours, head left: hands under the shoulders, knees under the hips,
// shins and the tops of the feet flat on the floor behind
function quadPre(p, sx){
  const S = [sx, G - ARM + 0.6], Hy = G - BONE.th;
  const H = [sx + Math.sqrt(BONE.torso**2 - (Hy - S[1])**2), Hy];
  Object.assign(p, {hx:H[0], hy:H[1], t:ang(H, S)});
  if(p.wN===undefined){ Object.assign(p, T('aN', sx, G), T('aF', sx, G), L('lN', 90, 0), L('lF', 90, 0), {'lN.f':0, 'lF.f':0}); return p; }
  // bird dog: blend each limb between planted and reaching
  Object.assign(p, T('aN', sx, G, {'aN.w':p.wN}), T('aF', sx, G, {'aF.w':p.wF}),
    L('lN', lerp(90, -4, p.lnU), lerp(0, -4, p.lnU)), L('lF', lerp(90, -4, p.lfU), lerp(0, -4, p.lfU)),
    {'lN.f':lerp(0, 86, p.lnU), 'lF.f':lerp(0, 86, p.lfU)});
  return p;
}
function forearmPlankDef(knee){

function bridgeDef(march){
