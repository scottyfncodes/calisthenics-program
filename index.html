<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/exercises.js"></script>
<script src="js/figure.js"></script>
<script src="js/progress.js"></script>
<script src="js/planner.js"></script>
<script src="js/runner.js"></script>
<script>
(function(){
'use strict';
/* =========================================================
   STATE & STORAGE — one versioned record in localStorage.
   The classic 12-week program keeps its own key and is never touched.
   ========================================================= */
const KEY = 'cal-od-v1', LEGACY_KEY = 'cal-program-state';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();

function defaults(){
  return {v:1, onboarded:false, profile:{level:'beginner', goal:'balanced', equipment:[], avoid:[]},
    prefs:{minutes:20, focus:'auto', sound:true}, history:[], active:null, last:null};
}
function sanitize(d){
  const out = defaults();
  if(!d || typeof d!=='object') return out;
  out.onboarded = !!d.onboarded;
  out.profile = Planner.normProfile(d.profile);
  const p = d.prefs && typeof d.prefs==='object' ? d.prefs : {};
  out.prefs.minutes = Planner.normMinutes(p.minutes===undefined ? 20 : p.minutes);
  out.prefs.focus = Planner.FOCI[p.focus] ? p.focus : 'auto';
  out.prefs.sound = p.sound!==false;
  out.history = Progress.clean(d.history).slice(-300);
  const a = d.active;
  if(a && a.session && Array.isArray(a.session.steps) && Array.isArray(a.session.blocks) && a.run && Array.isArray(a.run.steps) && a.run.phase && a.run.results) out.active = a;
  if(d.last && d.last.entry && d.last.summary) out.last = d.last;
  return out;
}
let state;
let saveWarned = false;
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw){ state = defaults(); return; }
  try{ state = sanitize(JSON.parse(raw)); }
  catch(e){
    // keep the unreadable copy rather than silently destroying it
    try{ localStorage.setItem(KEY+'-unreadable', raw); }catch(_){}
    state = defaults();
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ if(!saveWarned){ saveWarned = true; toast("Couldn't save on this device (storage is full or blocked)."); } }
}
/* Progress from the classic program: a hint for the level question. */
function legacyInfo(){
  try{
    const s = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
    if(!s || typeof s!=='object') return null;
    const days = Object.keys(s.completed || {}).map(Number).filter(n => n>=1 && n<=84);
    const day = parseInt(s.day, 10);
    if(!days.length && !(day>1)) return null;
    const furthest = Math.max(day>=1 && day<=84 ? day : 1, ...days);
    return {days:days.length, furthest, level: furthest>63 ? 'advanced' : furthest>21 ? 'intermediate' : 'beginner'};
  }catch(e){ return null; }
}

/* =========================================================
   SMALL UI HELPERS
   ========================================================= */
const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
const fmtClock = s => { s = Math.max(0, Math.ceil(s - 0.001)); const m = Math.floor(s/60), r = s%60; return `${m}:${String(r).padStart(2,'0')}`; };
const fmtMin = s => `${Math.max(1, Math.round(s/60))} min`;
const exName = id => (EX[id] ? EX[id].name : id);
const sides = id => !!(EX[id] && EX[id].uni);
function targetText(it){
  if(it.mode==='reps') return `${it.reps} reps${sides(it.id) ? ' / side' : ''}`;
  return `${it.sec}s${sides(it.id) ? (it.alt ? ', alternating' : ' / side') : ''}`;
}
const PATTERN_COLOR = id => `var(${PATTERNS[EX[id].pat[0]].color})`;
const BLOCK_COLOR = {warm:'var(--dim)', skill:'var(--mob)', main:'var(--sun)', core:'var(--core)', finisher:'var(--full)', cardio:'var(--legs)', mobility:'var(--mob)', easy:'var(--core)', cool:'var(--mute)'};
const BLOCK_NAME = {warm:'Warm-up', skill:'Skill', main:'Strength', core:'Core', finisher:'Finisher', cardio:'Cardio', mobility:'Mobility', easy:'Easy core', cool:'Cool-down'};

let toastT = 0;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* Figures: animate every visible .fig[data-anim]; still poses elsewhere. */
let figRAF = 0;
function figLoop(t){
  figRAF = 0;
  const figs = document.querySelectorAll('.screen.active .fig[data-anim], .sheet.show .fig[data-anim]');
  if(!figs.length) return;
  if(reduceMotion.matches){ figs.forEach(still); return; }
  figs.forEach(svg => {
    const def = MOVES[svg.dataset.type]; if(!def) return;
    if(!svg._t0) svg._t0 = t;
    drawFig(svg, ((t - svg._t0)/(def.dur*1000)) % 1);
  });
  figRAF = requestAnimationFrame(figLoop);
}
function kickFigs(){ if(!figRAF) figRAF = requestAnimationFrame(figLoop); }
function still(svg){ const def = MOVES[svg.dataset.type]; if(def) drawFig(svg, def.still || 0); }
function fig(id, anim){
  const type = EX[id] ? EX[id].type : 'march';
  return figureSVG(type).replace('<svg ', `<svg ${anim ? 'data-anim="1" ' : ''}`);
}
function initFigs(root){ root.querySelectorAll('.fig').forEach(svg => { svg._t0 = 0; still(svg); }); kickFigs(); }
if(reduceMotion.addEventListener) reduceMotion.addEventListener('change', () => { document.querySelectorAll('.fig').forEach(still); kickFigs(); });

/* Sound: one AudioContext, unlocked by a tap (iOS only plays audio started from a gesture). */
let audio = null;
function unlockAudio(){ try{ if(!audio) audio = new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended') audio.resume(); }catch(e){} }
function beep(freq=660, dur=0.18, when=0, vol=0.08){
  if(!state.prefs.sound || !audio) return;
  try{
    const t = audio.currentTime + when, o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination); o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const chime = () => { beep(523, 0.16, 0, 0.06); beep(659, 0.16, 0.1, 0.06); beep(784, 0.36, 0.2, 0.07); };

/* The screen stays on while the player is open (where supported). */
let wakeLock = null;
async function wake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); }
    if(!on && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  }catch(e){}
}

/* =========================================================
   NAVIGATION — screens plus history entries, so the Back
   gesture works and can't silently leave a running workout.
   ========================================================= */
let screen = null;
function show(id, {push=true} = {}){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id===id));
  const prev = screen; screen = id;
  if(prev !== id) window.scrollTo(0, 0);
  if(push && prev && prev!==id){ try{ history.pushState({s:id}, ''); }catch(e){} }
  kickFigs();
}
window.addEventListener('popstate', () => {
  if(sheetOpen){ closeSheet(); if(screen==='player' || screen==='plan' || screen==='history') pushGuard(); return; }
  if(screen==='player' && state.active){ pushGuard(); doPause(); return; }   // Back mid-workout pauses and asks
  if(screen!=='home' && screen!=='onboard') goHome();
});
function pushGuard(){ try{ history.pushState({s:screen}, ''); }catch(e){} }
document.addEventListener('click', e => { if(e.target.closest('[data-back]')) { if(history.state && history.state.s) history.back(); else goHome(); } });

/* =========================================================
   SHEETS
   ========================================================= */
let sheetOpen = false, sheetOnClose = null, sheetReturn = null;
function openSheet(html, {onClose} = {}){
  const sh = $('#sheet');
  if(!sheetOpen) sheetReturn = document.activeElement;
  sh.innerHTML = `<div class="grab" aria-hidden="true"></div>${html}`;
  sh.classList.add('show'); $('#scrim').classList.add('show');
  sheetOpen = true; sheetOnClose = onClose || null;
  initFigs(sh);
  sh.scrollTop = 0;
  const f = sh.querySelector('button, a'); if(f) setTimeout(()=>{ try{ f.focus({preventScroll:true}); }catch(e){} }, 60);
}
function closeSheet(){
  if(!sheetOpen) return;
  $('#sheet').classList.remove('show'); $('#scrim').classList.remove('show');
  sheetOpen = false;
  const cb = sheetOnClose; sheetOnClose = null;
  if(sheetReturn && sheetReturn.focus) try{ sheetReturn.focus({preventScroll:true}); }catch(e){}
  if(cb) cb();
}
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetOpen) closeSheet(); });

function exerciseSheet(id){
  const e = EX[id];
  openSheet(`<h2 id="sheet-title">${esc(e.name)}</h2>
    <div class="plan-meta"><span class="pill">${esc(PATTERNS[e.pat[0]].label)}</span><span class="pill">Level ${e.lvl} of 5</span>${e.eq.length ? `<span class="pill">${e.eq.map(q=>esc(EQUIPMENT[q].label)).join(', ')}</span>` : ''}</div>
    <div class="ex-stage">${fig(id, true)}</div>
    <p class="ex-cue">${esc(e.cue)}</p>
    <ul class="ex-cues">${e.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    <p class="safety">The demo shows the movement; it can't check your form. Work in a pain-free range and stop if anything hurts.</p>
    <div class="stack"><button class="btn btn-ghost press" data-close>Close</button></div>`);
  $('#sheet').querySelector('[data-close]').onclick = closeSheet;
}

/* =========================================================
   ONBOARDING — three quick questions, all skippable.
   ========================================================= */
let ob = null;
function startOnboarding(){
  const leg = legacyInfo();
  ob = {step:0, level: leg ? leg.level : state.profile.level, equipment:[...state.profile.equipment], avoid:[...state.profile.avoid], legacy:leg};
  show('onboard', {push:false});
  renderOnboarding();
}
const LEVEL_TEXT = {
  beginner:['New to it', "Push-ups are tough, or it's been a while"],
  intermediate:['Some experience', 'Comfortable with push-ups, squats and planks'],
  advanced:['Experienced', 'Pull-ups, dips, single-leg work'],
};
function renderOnboarding(){
  const steps = 3, s = ob.step;
  const dots = Array.from({length:steps}, (_, i) => `<i class="${i<=s?'on':''}"></i>`).join('');
  const choice = (attr, k, t1, t2, on) => `<button class="choice press" data-${attr}="${k}" aria-pressed="${on}"><span class="txt"><span class="t1 blk">${esc(t1)}</span><span class="t2 blk">${esc(t2)}</span></span><span class="tick" aria-hidden="true"></span></button>`;
  let body = '';
  if(s===0){
    body = `<div class="hero" style="margin-top:8px"><h1>Your time.<br><span>Your workout.</span></h1></div>
      <h2 class="ob-q" style="font-size:22px; margin-top:22px">How much training experience do you have?</h2>
      <p class="ob-help">This sets the starting point. Your results take over after a few sessions.</p>
      <div class="choices">${Object.entries(LEVEL_TEXT).map(([k,[a,b]]) => choice('level', k, a, b, ob.level===k)).join('')}</div>
      ${ob.legacy ? `<p class="note">We found your 12-week program progress (day ${ob.legacy.furthest}). It's still there, under History.</p>` : ''}`;
  } else if(s===1){
    body = `<h1 class="ob-q">What do you have access to?</h1>
      <p class="ob-help">Everything works with bodyweight alone. Pick any that apply.</p>
      <div class="choices">${Object.entries(EQUIPMENT).map(([k,e]) => choice('eq', k, e.label, e.hint, ob.equipment.includes(k))).join('')}</div>`;
  } else {
    body = `<h1 class="ob-q">Anything to go easy on?</h1>
      <p class="ob-help">Optional. We'll leave out moves that load these areas.</p>
      <div class="choices">${Object.entries(RESTRICTIONS).map(([k,e]) => choice('avoid', k, e.label, e.hint, ob.avoid.includes(k))).join('')}</div>
      <p class="note">This is load management, not medical advice. If something hurts, stop and get it checked.</p>`;
  }
  $('#onboard').innerHTML = `<div class="wrap">
      <div class="topbar"><div class="ob-dots" role="img" aria-label="Step ${s+1} of ${steps}">${dots}</div><button class="btn-quiet press" id="ob-skip">${s===0 ? 'Skip setup' : 'Skip'}</button></div>
      ${body}
    </div>
    <div class="cta"><div class="cta-row">
      ${s>0 ? `<button class="btn btn-ghost press" id="ob-back" style="flex:0 0 auto">Back</button>` : ''}
      <button class="btn btn-primary press" id="ob-next" style="flex:1">${s===steps-1 ? "Let's go" : 'Continue'}</button></div></div>`;
  const root = $('#onboard');
  root.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { ob.level = b.dataset.level; root.querySelectorAll('[data-level]').forEach(x => x.setAttribute('aria-pressed', x===b)); });
  const toggleIn = (list, k) => list.includes(k) ? list.filter(x => x!==k) : [...list, k];
  root.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { ob.equipment = toggleIn(ob.equipment, b.dataset.eq); b.setAttribute('aria-pressed', ob.equipment.includes(b.dataset.eq)); });
  root.querySelectorAll('[data-avoid]').forEach(b => b.onclick = () => { ob.avoid = toggleIn(ob.avoid, b.dataset.avoid); b.setAttribute('aria-pressed', ob.avoid.includes(b.dataset.avoid)); });
  $('#ob-next').onclick = () => { if(ob.step < steps-1){ ob.step++; renderOnboarding(); window.scrollTo(0,0); } else finishOnboarding(true); };
  $('#ob-skip').onclick = () => finishOnboarding(s>0);
  if($('#ob-back')) $('#ob-back').onclick = () => { ob.step--; renderOnboarding(); };
}
function finishOnboarding(keep){
  if(keep) state.profile = Planner.normProfile({level:ob.level, goal:state.profile.goal, equipment:ob.equipment, avoid:ob.avoid});
  state.onboarded = true; save();
  goHome();
}

/* =========================================================
   HOME — the time selector is the front door.
   ========================================================= */
const STOPS = []; for(let m=5;m<=30;m++) STOPS.push(m); for(let m=35;m<=120;m+=5) STOPS.push(m);
const PRESETS = [5, 10, 15, 20, 30, 45, 60, 90, 120];
const idxFor = m => STOPS.reduce((b, v, i) => Math.abs(v-m) < Math.abs(STOPS[b]-m) ? i : b, 0);
let preview = null, variant = 0;

function goHome(){
  if(!state.onboarded){ startOnboarding(); return; }
  show('home', {push:false});
  try{ history.replaceState({}, ''); }catch(e){}
  renderHome();
}
function renderHome(){
  $('#time-slider').max = STOPS.length-1;
  $('#presets').innerHTML = PRESETS.map(p => `<button class="preset press" data-min="${p}" aria-pressed="false" aria-label="${p} minutes">${p}</button>`).join('');
  $('#focusrow').innerHTML = Object.entries(Planner.FOCI).map(([k,f]) => `<button class="chip press" data-focus="${k}" aria-pressed="false">${f.label}</button>`).join('');
  setMinutes(state.prefs.minutes, {silent:true, force:true});
  renderFocus();
  renderProfileChip();
  renderResume();
  renderRecent();
}
function setMinutes(m, {silent=false, force=false} = {}){
  m = Planner.normMinutes(m);
  const changed = m !== state.prefs.minutes;
  state.prefs.minutes = m;
  const i = STOPS.includes(m) ? STOPS.indexOf(m) : idxFor(m);
  const slider = $('#time-slider');
  slider.value = i; slider.style.setProperty('--p', `${(i/(STOPS.length-1))*100}%`);
  slider.setAttribute('aria-valuetext', `${m} minutes`);
  const num = $('#minutes'); num.textContent = m;
  if(changed && !silent && !reduceMotion.matches){ num.classList.remove('bump'); void num.offsetWidth; num.classList.add('bump'); }
  document.querySelectorAll('.preset').forEach(b => b.setAttribute('aria-pressed', +b.dataset.min===m));
  if(changed) variant = 0;
  if(changed || force) regenerate();
}
function renderFocus(){ document.querySelectorAll('#focusrow .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.focus===state.prefs.focus)); }
function renderProfileChip(){
  const p = state.profile;
  const eq = p.equipment.length ? `${p.equipment.length} equipment` : 'bodyweight';
  $('#profile-chip').textContent = `${p.level[0].toUpperCase()+p.level.slice(1)} · ${Planner.GOALS[p.goal].label.toLowerCase()} · ${eq}`;
}
function regenerate(){
  preview = Planner.generate({minutes:state.prefs.minutes, profile:state.profile, history:state.history, now:now(), focus:state.prefs.focus, variant});
  renderPreview();
  const b = $('#start-btn');
  b.disabled = !!preview.empty;
  b.innerHTML = preview.empty ? 'Change settings to start' : `Start workout <small>${fmtMin(preview.est)}</small>`;
}
function timelineHTML(s){
  const kinds = [];
  s.steps.forEach(st => {
    const k = s.blocks[st.block].kind, last = kinds[kinds.length-1];
    if(last && last.k===k) last.t += st.est; else kinds.push({k, t:st.est});
  });
  const totals = new Map();
  kinds.forEach(x => totals.set(x.k, (totals.get(x.k)||0) + x.t));
  return `<div class="timeline" aria-hidden="true">${kinds.map(x => `<i style="flex:${x.t}; --c:${BLOCK_COLOR[x.k]}"></i>`).join('')}</div>
    <div class="tl-legend">${[...totals].map(([k, t]) => `<span style="--c:${BLOCK_COLOR[k]}">${BLOCK_NAME[k]} ${fmtMin(t)}</span>`).join('')}</div>`;
}
function renderPreview(){
  const s = preview, el = $('#preview');
  if(s.empty){
    el.innerHTML = `<div class="pv-head"><div><h2 class="pv-title" id="pv-title">No workout fits</h2><p class="pv-sub">Your settings leave no suitable exercises. Try fewer restrictions in Settings.</p></div></div><div style="height:18px"></div>`;
    return;
  }
  const main = s.blocks.filter(b => !['warm','cool'].includes(b.kind));
  const items = main.flatMap(b => b.items.map(it => ({it, b}))).filter((x, i, a) => a.findIndex(y => y.it.id===x.it.id)===i);
  const shown = items.slice(0, 5), more = items.length - shown.length;
  el.innerHTML = `
    <div class="pv-head">
      <div><p class="eyebrow">Today's session · ${fmtMin(s.est)}</p><h2 class="pv-title" id="pv-title">${esc(s.title)}</h2><p class="pv-sub" id="pv-sub">${esc(s.subtitle)}</p></div>
      <button class="icon-btn press" id="shuffle" aria-label="Show a different workout"><svg viewBox="0 0 24 24"><path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c2 0 3.5-1.6 4.7-3.6M21 7h-3c-2 0-3.5 1.6-4.7 3.6"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
    </div>
    ${s.reason ? `<p class="pv-reason" id="pv-reason">${esc(s.reason)}</p>` : ''}
    ${timelineHTML(s)}
    <ul class="pv-list" id="pv-list">${shown.map(({it, b}) => `<li><button class="pv-item press" data-ex="${it.id}">
        <span class="thumb">${fig(it.id)}</span>
        <span class="txt"><span class="nm blk">${esc(exName(it.id))}</span><span class="dx blk">${b.rounds>1 ? b.rounds+' × ' : ''}${esc(targetText(it))}</span></span>
        <span class="tag" style="--c:${PATTERN_COLOR(it.id)}">${esc(PATTERNS[EX[it.id].pat[0]].short)}</span></button></li>`).join('')}
      ${more>0 ? `<li class="pv-more">+ ${more} more in the full plan</li>` : ''}</ul>
    ${s.notes.length ? `<div class="pv-notes">${s.notes.slice(0,2).map(n=>`<p>${esc(n)}</p>`).join('')}</div>` : ''}
    <div class="pv-foot"><button class="press" id="plan-btn">See the full plan →</button></div>`;
  initFigs(el);
  el.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => exerciseSheet(b.dataset.ex));
  $('#shuffle').onclick = () => { variant++; regenerate(); toast('Here’s a different take.'); };
  $('#plan-btn').onclick = openPlan;
}
function relDay(t){
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const d1 = new Date(t); d1.setHours(0,0,0,0);
  const days = Math.round((d0 - d1) / 864e5);
  return days<=0 ? 'Today' : days===1 ? 'Yesterday' : days<7 ? `${days} days ago` : new Date(t).toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function renderRecent(){
  const st = Progress.stats(state.history, now());
  if(!st.last){ $('#recent-slot').innerHTML = ''; return; }
  const F = Progress.fatigue(state.history, now());
  const col = {fresh:'var(--ok)', recovering:'var(--warn)', fatigued:'var(--bad)'};
  const rec = ['push','pull','legs','core'].map(r => { const s = Progress.status(F[r]); return `<span style="--c:${col[s]}">${r[0].toUpperCase()+r.slice(1)} ${s}</span>`; }).join('');
  $('#recent-slot').innerHTML = `<button class="recent press" id="recent" aria-label="Recent training. Open history">
      <span class="txt"><span class="t1 blk">Last: ${esc(st.last.title || 'Workout')}</span>
      <span class="t2 blk">${relDay(st.last.at)} · ${fmtMin(st.last.active||0)} · ${st.weekSessions} this week</span>
      <span class="recovery">${rec}</span></span>
      <span class="week" aria-hidden="true">${st.days.map(d => `<i class="${d?'on':''}"></i>`).join('')}</span></button>`;
  $('#recent').onclick = openHistory;
}
function renderResume(){
  const a = state.active;
  if(!a){ $('#resume-slot').innerHTML = ''; return; }
  const pct = Math.round(Runner.progress(a.run)*100);
  $('#resume-slot').innerHTML = `<div class="resume" id="resume-card"><div class="txt"><div class="t1">Workout in progress</div><div class="t2">${esc(a.session.title)} · ${pct}% done</div></div>
    <button class="btn btn-primary press" id="resume-btn" style="min-height:44px; padding:0 18px; font-size:14px">Resume</button></div>`;
  $('#resume-btn').onclick = () => openPlayer();
}

// home controls
$('#time-slider').addEventListener('input', e => setMinutes(STOPS[+e.target.value]));
$('#time-slider').addEventListener('change', save);
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-min]'); if(b){ setMinutes(+b.dataset.min); save(); } });
$('#focusrow').addEventListener('click', e => { const b = e.target.closest('[data-focus]'); if(!b) return; state.prefs.focus = b.dataset.focus; variant = 0; renderFocus(); regenerate(); save(); });
$('#start-btn').onclick = () => startWorkout();
$('#plan-start').onclick = () => startWorkout();
$('#settings-btn').onclick = openSettings;
$('#profile-chip').onclick = openSettings;
$('#history-btn').onclick = openHistory;

/* =========================================================
   FULL PLAN
   ========================================================= */
function blockMeta(b){
  if(b.format==='flow') return b.rounds>1 ? `${b.rounds} rounds, continuous` : 'continuous';
  const unit = b.format==='circuit' ? 'rounds' : 'sets';
  const rest = b.format==='superset' ? `rest ${b.restIn}s / ${b.restAfter}s` : b.format==='circuit' ? `rest ${b.restIn}s / ${b.restAfter}s` : `rest ${b.restAfter}s`;
  return `${b.rounds} ${unit} · ${rest}`;
}
function openPlan(){
  const s = preview;
  const blockTime = bi => s.steps.filter(st => st.block===bi).reduce((a, st) => a + st.est, 0);
  const how = {superset:'Alternate the pair, resting briefly between them and longer after each round.', circuit:'Move through each exercise in order, then rest before the next round.', straight:'All sets of one move, full rest between sets.', flow:'One move after another at an easy pace.'};
  $('#plan-body').innerHTML = `
    <h2 class="pv-title">${esc(s.title)}</h2>
    <div class="plan-meta"><span class="pill">${fmtMin(s.est)}</span><span class="pill">${s.steps.filter(x=>x.kind==='work').length} sets</span><span class="pill">${esc(Planner.GOALS[s.goal].label)}</span><span class="pill">${esc(s.level)}</span></div>
    ${s.reason ? `<p class="pv-reason" style="margin:12px 0 0">${esc(s.reason)}</p>` : ''}
    ${s.blocks.map((b, bi) => `<section class="block">
      <div class="block-h" style="--c:${BLOCK_COLOR[b.kind]}"><h3>${esc(b.label)}</h3><span class="meta">${fmtMin(blockTime(bi))} · ${esc(blockMeta(b))}</span></div>
      ${['superset','circuit'].includes(b.format) && b.kind!=='finisher' && bi < 4 ? `<p class="pv-notes" style="margin:8px 4px 0">${how[b.format]}</p>` : ''}
      <ul class="pv-list" style="padding:4px 0 0; margin-top:6px">${b.items.map((it, j) => `<li><button class="pv-item press" data-ex="${it.id}">
        <span class="thumb">${fig(it.id)}</span>
        <span class="txt"><span class="nm blk">${b.format==='superset' ? `<span class="mono" style="color:var(--dim)">${b.tag}${j+1}</span> ` : ''}${esc(exName(it.id))}</span><span class="dx blk">${esc(targetText(it))}</span></span>
        <span class="tag" style="--c:${PATTERN_COLOR(it.id)}">${esc(PATTERNS[EX[it.id].pat[0]].short)}</span></button></li>`).join('')}</ul>
    </section>`).join('')}
    ${s.notes.length ? `<div class="pv-notes" style="margin:20px 4px 0">${s.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</div>` : ''}
    <p class="safety">Times are estimates at a steady pace. Rest runs automatically; you can add rest, skip, swap an exercise or end early at any point. Work in a pain-free range. This app can't check your form or replace medical advice.</p>`;
  show('plan');
  initFigs($('#plan-body'));
  $('#plan-body').querySelectorAll('[data-ex]').forEach(b => b.onclick = () => exerciseSheet(b.dataset.ex));
  $('#plan-start').innerHTML = `Start workout <small>${fmtMin(s.est)}</small>`;
}

/* =========================================================
   PLAYER
   ========================================================= */
let active = null;           // state.active while the player is open
let loop = 0, lastKey = '', tapGuard = 0, repsAdj = {}, lastBeep = '';

function startWorkout(){
  if(!preview || preview.empty) return;
  unlockAudio();
  if(state.active){
    openSheet(`<h2 id="sheet-title">Workout in progress</h2><p class="lead">You have an unfinished workout. Starting a new one ends it and saves the sets you completed.</p>
      <div class="stack"><button class="btn btn-primary press" id="rp-resume">Resume it</button><button class="btn btn-danger press" id="rp-new">End it and start this one</button></div>`);
    $('#rp-resume').onclick = () => { closeSheet(); openPlayer(); };
    $('#rp-new').onclick = () => { closeSheet(); finishActive({silent:true}); beginNew(); };
    return;
  }
  beginNew();
}
function beginNew(){
  const session = JSON.parse(JSON.stringify(preview));   // freeze exactly what was previewed
  state.active = {session, run:Runner.start(session, now())};
  repsAdj = {};
  save();
  openPlayer();
}
function openPlayer(){
  if(!state.active) return goHome();
  active = state.active;
  unlockAudio();
  Runner.tick(active.run, now());
  if(active.run.phase==='done') return finishActive();
  if(screen!=='player') show('player');
  buildBar();
  lastKey = '';
  renderPlayer(true);
  clearInterval(loop); loop = setInterval(onTick, 250);
  wake(true);
}
function closePlayer(){ clearInterval(loop); loop = 0; wake(false); active = null; }
function persist(){ if(active) state.active = active; save(); }

function buildBar(){
  const s = active.session, parts = [];
  s.steps.forEach((st, i) => { const last = parts[parts.length-1]; if(last && last.block===st.block){ last.est += st.est; last.idx.push(i); } else parts.push({block:st.block, est:st.est, idx:[i]}); });
  active._parts = parts;
  $('#pl-bar').innerHTML = parts.map(p => `<span style="--w:${p.est}"><i></i></span>`).join('');
}
function updateBar(){
  const run = active.run, cur = Runner.current(run), spans = $('#pl-bar').children;
  (active._parts || []).forEach((p, k) => {
    const tot = p.idx.reduce((a, i) => a + run.steps[i].est, 0) || 1;
    const done = p.idx.reduce((a, i) => a + (run.results[i] || i < cur ? run.steps[i].est : 0), 0);
    if(spans[k]) spans[k].style.setProperty('--f', Math.min(1, done/tot));
  });
}

function onTick(){
  if(!active) return;
  const run = active.run, t = now();
  const before = run.phase + ':' + run.i;
  Runner.tick(run, t);
  if(run.phase + ':' + run.i !== before){
    // a timer ran out
    if(run.phase==='work' && run.t1){ beep(880, 0.2); buzz(30); }
    else { beep(660, 0.12); setTimeout(()=>beep(990, 0.18), 140); buzz([20,60,20]); }
    persist();
    if(run.phase==='done') return finishActive();
    renderPlayer();
    return;
  }
  updateLive(t);
}

/* countdowns etc., without rebuilding the DOM */
function updateLive(t){
  const run = active.run;
  $('#pl-left').textContent = `${fmtClock(Runner.remainingSec(run, t))} left`;
  if(!run.t1 || run.paused) return;
  const remain = Math.max(0, (run.t1 - t)/1000), total = Math.max(1, (run.t1 - run.t0)/1000);
  const secs = Math.ceil(remain - 0.001);
  $('#pl-target').textContent = run.phase==='prep' ? `${secs}` : fmtClock(remain);
  const bar = $('#pl-timerbar i'); if(bar) bar.style.transform = `scaleX(${remain/total})`;
  if(secs<=3 && secs>0 && lastBeep!==`${secs}:${run.i}:${run.phase}`){ lastBeep = `${secs}:${run.i}:${run.phase}`; beep(run.phase==='rest' ? 440 : 520, 0.06); }
  // per-side holds: switch sides halfway
  const st = run.steps[run.i];
  if(run.phase==='work' && st.mode==='time' && sides(st.id) && !st.alt){
    const second = t - run.t0 >= (run.t1 - run.t0)/2;
    const tag = $('#side-tag'), label = second ? 'Side 2' : 'Side 1';
    if(tag && tag.textContent!==label){ tag.textContent = label; if(second){ beep(740, 0.15); buzz(40); toast('Switch sides'); } }
  }
}

function renderPlayer(force){
  const run = active.run, s = active.session, t = now();
  if(run.phase==='done') return finishActive();
  const k = Runner.current(run), st = run.steps[k], block = s.blocks[st.block], E = EX[st.id];
  const player = $('#player');
  player.dataset.phase = run.phase;
  player.dataset.timed = st.mode==='time' ? '1' : '0';
  $('#pl-paused').hidden = !run.paused;
  if(run.paused) $('#pl-paused-sub').textContent = `${exName(st.id)} · ${fmtClock(Runner.remainingSec(run, t))} left`;
  $('#pl-block').textContent = block.label;
  updateBar();
  const key = `${run.phase}|${run.i}|${st.id}|${run.paused}`;
  if(key===lastKey && !force){ updateLive(t); return; }
  lastKey = key;
  tapGuard = t + 400;   // swallow taps aimed at the previous state

  // stage: the move being done — during rest, the move coming up
  const stage = $('#pl-stage');
  const showSides = st.mode==='time' && sides(st.id) && !st.alt && run.phase!=='rest';
  if(stage.dataset.ex !== st.id || force){
    stage.dataset.ex = st.id;
    stage.innerHTML = fig(st.id, true) + `<span class="stage-tag" id="stage-tag"></span><span class="side-tag" id="side-tag" ${showSides ? '' : 'hidden'}>Side 1</span>`;
    initFigs(stage);
  }
  $('#stage-tag').textContent = run.phase==='rest' ? 'Up next' : (BLOCK_NAME[block.kind] || block.label);
  $('#side-tag').hidden = !showSides;

  const setTxt = st.sets>1 ? (block.format==='circuit' || block.format==='flow' ? `Round ${st.set} of ${st.sets}` : `Set ${st.set} of ${st.sets}`) : block.label;
  let kicker = setTxt + (st.label ? ` · ${st.label}` : ''), target = '', controls = '';
  $('#pl-timerbar').hidden = true;
  if(run.phase==='rest'){
    kicker = 'Rest';
    target = fmtClock((run.t1 - t)/1000);
    $('#pl-timerbar').hidden = false;
    let prevIdx = -1; for(let j=run.i-1;j>=0;j--) if(run.steps[j].kind==='work'){ prevIdx = j; break; }
    const prev = run.steps[prevIdx];
    const askEffort = prev && ['main','core','skill'].includes(s.blocks[prev.block].kind) && run.results[prevIdx] && run.results[prevIdx].done && Runner.lastSetOf(run, prevIdx);
    controls = `${askEffort ? `<div class="effort"><div class="q">How did ${esc(exName(prev.id))} feel?</div><div class="row" role="group" aria-label="Effort">
        ${['easy','solid','tough'].map(e => `<button class="press" data-effort="${e}" data-ex="${prev.id}" aria-pressed="${run.efforts[prev.id]===e}">${e[0].toUpperCase()+e.slice(1)}</button>`).join('')}</div></div>` : ''}
      <div class="row"><button class="btn btn-ghost press" id="rest-sub" aria-label="15 seconds less rest" style="flex:0 0 76px">−15s</button>
      <button class="btn btn-primary press" id="rest-skip">Skip rest</button>
      <button class="btn btn-ghost press" id="rest-add" aria-label="15 seconds more rest" style="flex:0 0 76px">+15s</button></div>`;
  } else if(run.phase==='ready'){
    target = `${Runner.duration(st)}<small>sec</small>`;
    if(sides(st.id)) kicker += st.alt ? ' · alternate sides' : ' · both sides';
    controls = `<button class="btn btn-primary btn-block big-btn press" id="pl-start">Start</button>
      <div class="row" style="margin-top:6px"><button class="btn-quiet press" id="pl-skip">Skip</button></div>`;
  } else if(run.phase==='prep'){
    kicker = 'Get ready';
    target = `${Math.ceil((run.t1 - t)/1000)}`;
    controls = `<div class="row"><button class="btn btn-ghost press" id="pl-skip">Skip this one</button></div>`;
  } else if(st.mode==='time'){
    target = fmtClock((run.t1 - t)/1000);
    $('#pl-timerbar').hidden = false;
    if(st.alt) kicker += ' · alternate sides';
    controls = `<button class="btn btn-ghost btn-block big-btn press" id="pl-done">Finish early</button>
      <div class="row" style="margin-top:6px"><button class="btn-quiet press" id="pl-skip">Skip set</button></div>`;
  } else {
    const val = repsAdj[run.i] !== undefined ? repsAdj[run.i] : st.reps;
    target = `${st.reps}<small>${E.uni ? 'reps / side' : 'reps'}</small>`;
    controls = `<div class="stepper"><button class="press" id="reps-minus" aria-label="One rep fewer">−</button>
        <div class="val">reps done<b id="reps-val" aria-live="polite">${val}</b></div>
        <button class="press" id="reps-plus" aria-label="One rep more">+</button></div>
      <button class="btn btn-primary btn-block big-btn press" id="pl-done">Done</button>
      <div class="row" style="margin-top:6px"><button class="btn-quiet press" id="pl-skip">Skip set</button></div>`;
  }
  $('#pl-kicker').textContent = kicker;
  $('#pl-name').textContent = E.name;
  $('#pl-target').innerHTML = target;
  const cues = run.phase==='rest' ? [st.mode==='reps' ? `${st.reps} reps${E.uni ? ' / side' : ''}` : `${Runner.duration(st)}s`, E.cues[0]] : E.cues.slice(0, 3);
  $('#pl-cues').innerHTML = cues.map(c => `<li>${esc(c)}</li>`).join('');
  $('#pl-controls').innerHTML = controls;
  bindControls();

  const nx = run.phase==='rest' ? nextAfter(run, k) : Runner.upNext(run);
  $('#pl-next').innerHTML = nx
    ? `<span class="thumb">${fig(nx.id)}</span><span class="txt"><span class="l blk">${run.phase==='rest' ? 'After that' : 'Next'}</span><span class="n blk">${esc(exName(nx.id))} · ${esc(targetText(nx))}</span></span>`
    : `<span class="txt"><span class="l blk">Next</span><span class="n blk">Finish. Nice work</span></span>`;
  initFigs($('#pl-next'));
  updateLive(t);
}
function nextAfter(run, k){
  for(let j=k+1;j<run.steps.length;j++){ const s = run.steps[j]; if(s.kind==='work' && !run.results[j]) return s; }
  return null;
}
function guarded(fn){ return e => { const t = now(); if(t < tapGuard) return; tapGuard = t + 500; fn(e); }; }
function act(fn){
  if(!active) return;
  fn(active.run, now());
  persist();
  if(active.run.phase==='done') return finishActive();
  renderPlayer();
}
function bindControls(){
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on('pl-start', guarded(() => { unlockAudio(); act((r, t) => Runner.begin(r, t)); }));
  on('pl-done', guarded(() => {
    const r = active.run, st = r.steps[r.i];
    const v = st.mode==='reps' ? (repsAdj[r.i] !== undefined ? repsAdj[r.i] : st.reps) : undefined;
    buzz(15);
    act((run, t) => Runner.complete(run, t, v));
  }));
  on('pl-skip', guarded(() => act((r, t) => Runner.skip(r, t))));
  on('rest-skip', guarded(() => act((r, t) => Runner.skip(r, t))));
  on('rest-add', () => act((r, t) => Runner.adjustRest(r, t, 15)));
  on('rest-sub', () => act((r, t) => Runner.adjustRest(r, t, -15)));
  const adj = d => () => {
    const r = active.run, st = r.steps[r.i];
    const v = Math.max(0, Math.min(200, (repsAdj[r.i] !== undefined ? repsAdj[r.i] : st.reps) + d));
    repsAdj[r.i] = v;
    $('#reps-val').textContent = v;
    $('#pl-done').textContent = v>0 ? 'Done' : 'Log as skipped';
  };
  on('reps-minus', adj(-1)); on('reps-plus', adj(1));
  document.querySelectorAll('#pl-controls [data-effort]').forEach(b => b.onclick = () => {
    const r = active.run, cur = r.efforts[b.dataset.ex];
    Runner.setEffort(r, b.dataset.ex, cur===b.dataset.effort ? null : b.dataset.effort);
    persist();
    document.querySelectorAll('#pl-controls [data-effort]').forEach(x => x.setAttribute('aria-pressed', r.efforts[x.dataset.ex]===x.dataset.effort));
  });
}
function doPause(){
  if(!active || active.run.phase==='done') return;
  if(!active.run.paused){ Runner.pause(active.run, now()); persist(); }
  renderPlayer(true);
  setTimeout(() => { try{ $('#pl-resume').focus({preventScroll:true}); }catch(e){} }, 30);
}
const resumeRun = () => { if(active && active.run.paused) Runner.resume(active.run, now()); };
$('#pl-pause').onclick = doPause;
$('#pl-close').onclick = doPause;
$('#pl-resume').onclick = () => { unlockAudio(); resumeRun(); persist(); renderPlayer(true); };
$('#pl-skipex').onclick = () => { resumeRun(); act((run, t) => Runner.skipExercise(run, t)); toast('Exercise skipped'); };
$('#pl-swap').onclick = () => {
  const r = active.run, st = r.steps[Runner.current(r)];
  const exclude = r.steps.filter(x => x.kind==='work').map(x => x.id);
  const ctx = {profile:active.session.profile, history:state.history, now:now()};
  const subs = Planner.substitutes(st.id, Object.assign({exclude}, ctx));
  if(!subs.length){ toast('No alternative fits your equipment and settings'); return; }
  const rel = id => EX[id].lvl < EX[st.id].lvl ? 'Easier' : EX[id].lvl > EX[st.id].lvl ? 'Harder' : 'Similar';
  openSheet(`<h2 id="sheet-title">Swap ${esc(exName(st.id))}</h2><p class="lead">Same movement pattern, with your equipment. Its remaining sets switch over.</p>
    <div class="card" style="margin-top:14px">${subs.map(id => `<button class="li press" data-swap="${id}" style="width:100%; text-align:left">
      <span class="thumb">${fig(id)}</span><span class="txt"><span class="t1 blk">${esc(exName(id))}</span>
      <span class="t2 blk">${rel(id)} · ${esc(targetText(Object.assign({id}, Planner.targetFor(id, ctx))))}</span></span></button>`).join('')}</div>
    <div class="stack"><button class="btn btn-ghost press" data-close>Cancel</button></div>`);
  $('#sheet').querySelectorAll('[data-swap]').forEach(b => b.onclick = () => {
    const id = b.dataset.swap;
    closeSheet();
    resumeRun();
    act((run, t) => Runner.swap(run, t, id, Planner.targetFor(id, ctx)));
    lastKey = ''; renderPlayer(true);
    toast(`Swapped to ${exName(id)}`);
  });
  $('#sheet').querySelector('[data-close]').onclick = closeSheet;
};
$('#pl-end').onclick = () => {
  const done = Object.values(active.run.results).filter(x => x.done).length;
  openSheet(`<h2 id="sheet-title">End workout?</h2><p class="lead">${done ? `You've done ${done} set${done===1?'':'s'}. They'll be saved; the rest will be marked as not done.` : "Nothing's logged yet, so this workout won't be saved."}</p>
    <div class="stack"><button class="btn btn-danger press" id="end-confirm">End workout</button><button class="btn btn-ghost press" id="end-cancel">Keep going</button></div>`);
  $('#end-confirm').onclick = () => { closeSheet(); Runner.end(active.run, now()); persist(); finishActive(); };
  $('#end-cancel').onclick = closeSheet;
};

document.addEventListener('visibilitychange', () => {
  if(!active) return;
  if(document.visibilityState==='visible' && screen==='player'){
    Runner.tick(active.run, now()); persist();
    wakeLock = null; wake(true);
    if(active.run.phase==='done') return finishActive();
    lastKey = ''; renderPlayer(true);
  } else if(document.visibilityState==='hidden') persist();
});
window.addEventListener('pagehide', () => { if(active) persist(); });

/* =========================================================
   FINISH → SUMMARY + HISTORY
   ========================================================= */
function finishActive({silent=false} = {}){
  const a = active || state.active;
  if(!a) return goHome();
  const t = now();
  if(a.run.phase!=='done') Runner.end(a.run, t);
  const entry = Runner.historyEntry(a.run, a.session, t);
  const summary = Runner.summary(a.run, a.session, t);
  const prior = state.history.slice();
  const logged = entry.entries.some(e => e.sets.length);
  closePlayer();
  state.active = null;
  if(!logged){
    save();
    if(!silent){ toast('Workout ended. Nothing was logged.'); goHome(); }
    return;
  }
  const achievements = Progress.achievements(prior, entry);
  state.history.push(entry);
  state.history = state.history.slice(-300);
  const notes = progressNotes(prior, state.history, entry);
  state.last = {entry, summary, achievements, notes, title:a.session.title};
  save();
  if(silent) return;
  chime(); buzz([14,70,28]);
  showSummary();
}
function progressNotes(prior, after, entry){
  const a = Progress.derive(prior), b = Progress.derive(after), out = [];
  for(const e of entry.entries){
    const def = EX[e.id];
    if(!def || (def.role!=='main' && def.role!=='cond') || !e.sets.length || (e.mode && e.mode!==def.m)) continue;
    const pa = a.ex[e.id], pb = b.ex[e.id], unit = def.m==='time' ? 's' : ' reps';
    if(!pb) continue;
    const per = def.uni ? ' per side' : '';
    if(pb.ready && !(pa && pa.ready)) out.push({id:e.id, text:`Topped out. A harder ${PATTERNS[def.pat[0]].short.toLowerCase()} variation comes next.`});
    else if(!pa) out.push({id:e.id, text:`Baseline set: ${pb.next}${unit}${per} next time.`});
    else if(pb.next > e.target) out.push({id:e.id, text:`Up to ${pb.next}${unit}${per} next time (from ${e.target}).`});
    else if(pb.next < e.target) out.push({id:e.id, text:`Back to ${pb.next}${unit}${per} to consolidate.`});
    else out.push({id:e.id, text: pb.streak ? `Holding at ${pb.next}${unit}${per}. One more solid session to progress.` : `Holding at ${pb.next}${unit}${per} until it feels solid.`});
  }
  return out.slice(0, 6);
}
function showSummary(){
  const L = state.last;
  if(!L) return goHome();
  const sm = L.summary, ok = sm.status==='complete', pct = Math.round(sm.completion*100);
  const check = `<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4L18.5 7.5"/></svg>`;
  const recName = {pr:'Personal record', first:'First time', unlock:'New progression unlocked'};
  const rows = sm.exercises.filter(e => Runner.MAIN_KINDS.includes(e.kind));
  $('#summary-body').innerHTML = `
    <div class="done-mark ${ok ? '' : 'partial'}" aria-hidden="true">${ok ? check : `<span class="mono" style="font-weight:600">${pct}%</span>`}</div>
    <h1 class="sm-title" id="sm-status">${ok ? 'Workout complete' : 'Ended early'}</h1>
    <p class="sm-sub">${esc(L.title)}${ok && sm.skippedSets ? ` · ${sm.skippedSets} set${sm.skippedSets===1?'':'s'} skipped` : ''}${!ok ? ` · ${pct}% of the plan done` : ''}</p>
    <div class="stats">
      <div class="stat sm-stat"><div class="v">${fmtClock(sm.activeSec)}</div><div class="k">Time</div></div>
      <div class="stat sm-stat"><div class="v">${sm.setsDone}<small>/ ${sm.setsPlanned}</small></div><div class="k">Sets</div></div>
      <div class="stat sm-stat"><div class="v">${sm.reps}</div><div class="k">Reps</div></div>
      <div class="stat sm-stat"><div class="v">${fmtClock(sm.holdSec)}</div><div class="k">Holds & intervals</div></div>
    </div>
    ${L.achievements.length ? `<h2 class="section-h">Milestones</h2><div class="card">${L.achievements.slice(0,6).map(a => `<div class="li"><span class="rec-icon" aria-hidden="true">${a.kind==='pr' ? 'PR' : a.kind==='unlock' ? '↑' : '★'}</span>
      <span class="txt"><span class="t1 blk">${esc(exName(a.id))}</span><span class="t2 blk">${recName[a.kind]}${a.kind==='pr' ? ` · ${a.value}${a.unit==='s' ? 's' : ' reps'} (was ${a.prev})` : ''}</span></span></div>`).join('')}</div>` : ''}
    ${L.notes.length ? `<h2 class="section-h">Next time</h2><div class="card">${L.notes.map(n => `<div class="li"><span class="txt"><span class="t1 blk">${esc(exName(n.id))}</span><span class="t2 blk">${esc(n.text)}</span></span></div>`).join('')}</div>` : ''}
    <h2 class="section-h">What you did</h2>
    <div class="card">${rows.map(e => `<div class="li"><span class="txt"><span class="t1 blk">${esc(exName(e.id))}</span>
      <span class="t2 blk">${e.sets.length ? e.sets.map(v => e.mode==='reps' ? v : v+'s').join(' · ') : 'Not done'}${e.effort ? ` · felt ${e.effort}` : ''}${e.swappedFrom ? ` · swapped from ${esc(exName(e.swappedFrom))}` : ''}</span></span>
      <span class="badge ${e.sets.length>=e.planned ? 'ok' : 'part'}">${e.sets.length}/${e.planned}</span></div>`).join('') || '<div class="li"><span class="txt t2">Warm-up and mobility only.</span></div>'}</div>
    <p class="safety">Recovery is part of the plan: whatever you worked hard today gets less volume next time, until it has recovered.</p>`;
  show('summary', {push:false});
}
$('#sm-done').onclick = () => goHome();

/* =========================================================
   HISTORY
   ========================================================= */
function openHistory(){
  const h = state.history.slice().reverse();
  const st = Progress.stats(state.history, now());
  const best = Progress.records(state.history);
  const prs = Object.entries(best).filter(([id]) => EX[id] && (EX[id].role==='main' || EX[id].role==='cond')).sort((a, b) => EX[b[0]].lvl - EX[a[0]].lvl || (a[0] < b[0] ? -1 : 1)).slice(0, 6);
  const setsOf = x => x.entries.reduce((a, e) => a + (Runner.MAIN_KINDS.includes(e.kind) ? e.sets.length : 0), 0);
  $('#history-body').innerHTML = `
    <div class="hist-stats">
      <div class="stat"><div class="v">${st.weekSessions}</div><div class="k">This week</div></div>
      <div class="stat"><div class="v">${st.weekMinutes}<small>min</small></div><div class="k">Minutes</div></div>
      <div class="stat"><div class="v">${st.total}</div><div class="k">All time</div></div>
    </div>
    ${prs.length ? `<h2 class="section-h">Best sets</h2><div class="card">${prs.map(([id, v]) => `<div class="li"><span class="txt"><span class="t1 blk">${esc(exName(id))}</span></span><span class="badge part">${v}${EX[id].m==='time' ? 's' : ' reps'}</span></div>`).join('')}</div>` : ''}
    <h2 class="section-h">Sessions</h2>
    ${h.length ? `<div class="card" id="hist-list">${h.slice(0, 60).map(x => `<div class="li hist-item"><span class="txt"><span class="t1 blk">${esc(x.title || 'Workout')}</span>
      <span class="t2 blk">${relDay(x.at)} · ${fmtMin(x.active||0)} · ${setsOf(x)} sets</span></span>
      <span class="badge ${x.status==='complete' ? 'ok' : 'part'}">${x.status==='complete' ? 'Done' : Math.round((x.completion||0)*100)+'%'}</span></div>`).join('')}</div>`
      : `<div class="empty">No workouts yet. Your sessions, records and progressions will show up here.</div>`}
    <a class="link-card press" href="program.html"><span class="txt"><span class="t1 blk" style="font-weight:600">Classic 12-week program</span><span class="t2 blk">The original day-by-day plan, with your saved progress</span></span><span aria-hidden="true">→</span></a>`;
  show('history');
}

/* =========================================================
   SETTINGS
   ========================================================= */
function openSettings(){
  const p = state.profile;
  const seg = (name, opts, cur) => `<div class="seg" role="group" style="--n:${opts.length}">${opts.map(([k, l]) => `<button class="press" data-${name}="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>`;
  const tog = (attr, k, t1, t2, on) => `<button class="toggle" role="switch" data-${attr}="${k}" aria-checked="${on}"><span class="txt"><span class="t1 blk">${esc(t1)}</span><span class="t2 blk">${esc(t2)}</span></span><span class="sw" aria-hidden="true"></span></button>`;
  openSheet(`<h2 id="sheet-title">Settings</h2>
    <div class="field"><span class="eyebrow">Experience</span>${seg('level', [['beginner','New'],['intermediate','Some'],['advanced','Experienced']], p.level)}</div>
    <div class="field"><span class="eyebrow">Goal</span>${seg('goal', Object.entries(Planner.GOALS).map(([k,g]) => [k, g.label]), p.goal)}</div>
    <div class="field"><span class="eyebrow">Equipment</span>${Object.entries(EQUIPMENT).map(([k,e]) => tog('eq', k, e.label, e.hint, p.equipment.includes(k))).join('')}</div>
    <div class="field"><span class="eyebrow">Go easy on</span>${Object.entries(RESTRICTIONS).map(([k,e]) => tog('avoid', k, e.label, e.hint, p.avoid.includes(k))).join('')}</div>
    <div class="field"><span class="eyebrow">Workout</span>${tog('sound', 'sound', 'Sound cues', 'Beeps for countdowns and the end of rest', state.prefs.sound)}</div>
    <p class="safety">Once you've trained a few times, your results steer the difficulty. Restrictions leave out moves that load an area; they're not medical advice.</p>
    <div class="stack"><button class="btn btn-primary press" id="set-done">Done</button>
      <a class="btn btn-ghost press" href="program.html" style="text-decoration:none">Classic 12-week program</a>
      <button class="btn btn-quiet press" id="set-reset">Reset on-demand data</button></div>`, {onClose:() => { if(screen==='home'){ renderProfileChip(); variant = 0; regenerate(); } }});
  const sh = $('#sheet');
  const upd = () => { state.profile = Planner.normProfile(state.profile); save(); };
  const flip = (list, k) => list.includes(k) ? list.filter(x => x!==k) : [...list, k];
  sh.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { state.profile.level = b.dataset.level; upd(); sh.querySelectorAll('[data-level]').forEach(x => x.setAttribute('aria-pressed', x===b)); });
  sh.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { state.profile.goal = b.dataset.goal; upd(); sh.querySelectorAll('[data-goal]').forEach(x => x.setAttribute('aria-pressed', x===b)); });
  sh.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { state.profile.equipment = flip(state.profile.equipment, b.dataset.eq); upd(); b.setAttribute('aria-checked', state.profile.equipment.includes(b.dataset.eq)); });
  sh.querySelectorAll('[data-avoid]').forEach(b => b.onclick = () => { state.profile.avoid = flip(state.profile.avoid, b.dataset.avoid); upd(); b.setAttribute('aria-checked', state.profile.avoid.includes(b.dataset.avoid)); });
  sh.querySelector('[data-sound]').onclick = e => { state.prefs.sound = !state.prefs.sound; save(); e.currentTarget.setAttribute('aria-checked', state.prefs.sound); };
  $('#set-done').onclick = closeSheet;
  $('#set-reset').onclick = () => {
    openSheet(`<h2 id="sheet-title">Reset everything?</h2><p class="lead">This deletes your on-demand history, records and settings on this device. The classic 12-week program's progress is kept.</p>
      <div class="stack"><button class="btn btn-danger press" id="reset-confirm">Delete my data</button><button class="btn btn-ghost press" id="reset-cancel">Cancel</button></div>`);
    $('#reset-confirm').onclick = () => { closeSheet(); closePlayer(); state = defaults(); save(); toast('Data reset'); startOnboarding(); };
    $('#reset-cancel').onclick = closeSheet;
  };
}

/* =========================================================
   BOOT
   ========================================================= */
load();
if(!state.onboarded) startOnboarding();
else {
  goHome();
  // a workout was running when the page closed: go straight back to it
  if(state.active) openPlayer();
}
})();
</script>
</body>
</html>
