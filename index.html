  const D = 16;
  const stepAt = (ph, a, b) => { const k = clamp((ph-a)/(b-a), 0, 1); return {k:EASE.io(k), lift:Math.sin(Math.PI*k)}; };
  return {face:-1, nofloorTicks:false, still:0, keys:[K(0,{b:0}), K(0.5,{b:1})],
    pre:function(p, ph){
      const crawl = this.crawl;
      const shift = crawl ? -D*ph : 0;
      const H = [H0[0] + shift, H0[1] - (crawl ? 0 : 0.5*p.b)], S = [S0[0] + shift, S0[1] - (crawl ? 0 : 0.3*p.b)];
      Object.assign(p, {hx:H[0], hy:H[1], t:ang(H, S), n:-4, cam:crawl ? shift : 0});
      const place = (home, win) => {
        if(!crawl) return {x:home, lift:0};
        // a limb steps once per cycle in its window; between steps it is planted in the world
        const s = stepAt(ph, ...win), off = win[0]===0 ? D*0.125 : -D*0.125;
        return {x:home + off - D*s.k, lift:s.lift};
      };
      const hN = place(S0[0], [0, 0.42]), hF = place(S0[0], [0.5, 0.92]);
      const fF = place(H0[0] + ankOff[0], [0, 0.42]), fN = place(H0[0] + ankOff[0], [0.5, 0.92]);
      Object.assign(p, T('aN', hN.x, G - 4*hN.lift), T('aF', hF.x, G - 4*hF.lift),
        T('lN', fN.x, G + ankOff[1] - 4*fN.lift), T('lF', fF.x, G + ankOff[1] - 4*fF.lift), {'lN.f':footF - 30*fN.lift, 'lF.f':footF - 30*fF.lift});
      return p;
    }};
}
function walkLungeDef(){
  // world coordinates; each half cycle is one lunge (stride 36) and the camera
  // tracks the hips. Feet are placed by their toes, so the old front foot rolls
  // onto its ball about a fixed point as it becomes the back foot.
  const X0 = 56, ST = 36, BT = 75;
  const half = (front, back, off, o) => [
    K(o+0,    {hx:off+X0-16, hy:G-21, t:-85}, toeAt(front, off+X0+6, G, 0), toeAt(back, off+X0-30, G, BT), L('aN',100,86), L('aF',100,86)),
    K(o+0.08, {}),
    K(o+0.2,  {hx:off+X0-4, hy:G-31, t:-88}, toeAt(back, off+X0-17, G-6, 45)),
    K(o+0.29, {hx:off+X0+2, hy:STAND+1.5}, toeAt(back, off+X0+9, G-7, 48), SIDE_HANG),
    K(o+0.4,  {hx:off+X0+10, hy:G-31}, toeAt(back, off+X0+ST+3, G-2, 18), toeAt(front, off+X0+6, G, 22)),
    K(o+0.44, {hx:off+X0+12, hy:G-29}, toeAt(back, off+X0+ST+6, G, 0), toeAt(front, off+X0+6, G, 40)),
  ];
  // the last key is the first one a full cycle (two strides) further on, so the loop is seamless
  const keys = [...half('lN','lF', 0, 0), ...half('lF','lN', ST, 0.5), half('lN','lF', 2*ST, 1)[0]];
  return {dur:3.6, still:0, travel:2*ST, keys,
    pre:(p, ph) => { p.cam = 2*ST*ph; return p; },
    pins:[['lN.toe', 0, 0.5], ['lF.toe', 0.44, 1]]};
}
function jumpLungeDef(){
  const FX = 58, BTX = 28, BT = 75;
  const lunge = (front, back) => Object.assign({hx:42, hy:G-21, t:-85}, toeAt(front, FX+6, G, 0), toeAt(back, BTX, G, BT));
  const air = (front, back, hy, x1, y1, f1, x2, y2, f2) => Object.assign({hx:43, hy, t:-88}, toeAt(front, x1, y1, f1), toeAt(back, x2, y2, f2));
  return {dur:2.2, still:0, keys:[
    K(0, lunge('lN','lF'), L('aN',125,95), L('aF',55,15)),
    K(0.12, air('lN','lF', G-33, FX+5, G, 35, BTX+2, G, 78), both(60,20)),
    K(0.24, air('lN','lF', G-40, 49, G-9, 40, 45, G-9, 45)),
    K(0.36, air('lF','lN', G-31, FX+5, G-1.5, 25, BTX+2, G-1, 70)),
    K(0.48, lunge('lF','lN'), L('aN',55,15), L('aF',125,95)),
    K(0.52, {}),
    K(0.62, air('lF','lN', G-33, FX+5, G, 35, BTX+2, G, 78), both(60,20)),
    K(0.74, air('lF','lN', G-40, 49, G-9, 40, 45, G-9, 45)),
    K(0.86, air('lN','lF', G-31, FX+5, G-1.5, 25, BTX+2, G-1, 70)),
    K(0.98, lunge('lN','lF'), L('aN',125,95), L('aF',55,15)),
  ]};
}
function burpeeDef(kind){
  // side view, facing right: the plank has the head to the right, feet back (left)
  const P = [62, G], FX = 46;   // hands land just in front of the feet
  const toeFor = S => { // toe position that puts a straight body's shoulder at S
    const al = solve(al => { const q = plankFromToe([0, G], al, 1); return shoulderOf(q)[1] - S[1]; }, -60, -0.5);
    const q = plankFromToe([0, G], al, 1); return [S[0] - shoulderOf(q)[0], al];
  };
  const Sp = [P[0], G - ARM + 0.6], [tx, alP] = toeFor(Sp), toe = [tx, G];
  const plank = al => plankFromToe(toe, al, 1);
  const alLow = solve(al => shoulderOf(plank(al))[1] - (G - 9.5), alP, 0);
  const pk = plank(alP), pkA = [pk.hx + LEG*Math.cos((alP+180)*D2R), pk.hy + LEG*Math.sin((alP+180)*D2R)];
  const plankLegs = Object.assign(toeAt('lN', ...toe, alP+90), toeAt('lF', ...toe, alP+90));
  const crouchLegs = Object.assign(toeAt('lN', FX+BONE.ft, G, 0), toeAt('lF', FX+BONE.ft, G, 0));
  // arm targets exist in every key (they are carried forward), so free-arm keys switch them off with w:0
  const hands = Object.assign(T('aN', ...P), T('aF', ...P), {'aN.w':1, 'aF.w':1});
  const free = {'aN.w':0, 'aF.w':0, 'lN.w':1, 'lF.w':1};
  const stand = Object.assign({hx:FX-1, hy:STAND, t:-90, n:0}, crouchLegs, SIDE_HANG, free);
  const squat = Object.assign({hx:FX-9, hy:72, t:-44, n:-10}, crouchLegs, both(35, 15), free);
  const crouch = Object.assign({hx:FX-7, hy:70, t:-28, n:-20}, crouchLegs, hands);
  const plankP = Object.assign({hx:pk.hx, hy:pk.hy, t:alP, n:0}, plankLegs, hands);
  const low = Object.assign({}, plankP, (() => { const q = plank(alLow); return Object.assign({hx:q.hx, hy:q.hy, t:alLow}, toeAt('lN', ...toe, alLow+90), toeAt('lF', ...toe, alLow+90)); })());
  const air = (o, h) => Object.assign({}, o, {hy:o.hy - h});
  const lift = (id, x, y, f) => toeAt(id, x, y, f);
  // mid-jump: the feet are in the air but the shoulders stay stacked over the planted hands
  const midT = -10, midH = add([P[0]+1, G-ARM+2], midT+180, BONE.torso);   // shoulders stay over the hands
  const mid = Object.assign({}, crouch, {hx:midH[0], hy:midH[1], t:midT});
  let keys;
  if(kind==='step'){
    const halfH = add([P[0]+1, G-ARM+2], -14+180, BONE.torso);
    const half = Object.assign({}, crouch, {hx:halfH[0], hy:halfH[1], t:-14}, lift('lN', ...toe, alP+90), lift('lF', FX+BONE.ft, G, 0));
    const stepN = Object.assign({}, half, lift('lN', (FX+toe[0])/2, G-6, 95));
    keys = [K(0, stand), K(0.06, stand), K(0.16, squat), K(0.24, crouch), K(0.31, stepN), K(0.37, half),
      K(0.44, Object.assign({}, half, lift('lF', (FX+toe[0])/2, G-6, 95))), K(0.5, plankP), K(0.58, plankP),
      K(0.64, Object.assign({}, half, lift('lF', (FX+toe[0])/2, G-6, 95))), K(0.7, half), K(0.77, stepN), K(0.83, crouch),
      K(0.9, squat)];
  } else {
    const jumpBack = Object.assign({}, mid, lift('lN', midH[0]-3, G-4, 105), lift('lF', midH[0]-3, G-4, 105));
    // take-off: hips pop up and the feet leave the floor before they travel back
    // weight shifts forward onto the hands (shoulders just past the wrists) so the hips rise
    const toT = -16, toH = add([P[0]+2, G-ARM+3], toT+180, BONE.torso);
    const takeoff = Object.assign({}, crouch, {hx:toH[0], hy:toH[1], t:toT});
    const base = [K(0, stand), K(0.05, stand), K(0.13, squat), K(0.2, crouch), K(0.225, takeoff), K(0.27, jumpBack), K(0.32, plankP)];
    const mid2 = kind==='half' ? [K(0.4, plankP)] : [K(0.36, plankP), K(0.46, low), K(0.5, low), K(0.58, plankP)];
    const o = kind==='half' ? 0.4 : 0.58;
    const back = [K(o+0.05, jumpBack), K(o+0.095, takeoff), K(o+0.12, crouch), K(o+0.18, squat)];
    const finish = kind==='half' ? [K(o+0.32, stand)] : kind==='full'
      ? [K(o+0.25, Object.assign({}, stand, {hy:STAND+3}, both(-80, -85))),
         K(o+0.31, Object.assign(air(stand, 7), lift('lN', FX+5, G-2, 60), lift('lF', FX+5, G-2, 60), both(-84, -88))),
         K(o+0.37, Object.assign({}, stand, {hy:STAND+3}, both(30, 20)))]
      : [K(o+0.25, Object.assign({}, stand, {hy:STAND+3}, both(-30, -40))),
         K(o+0.31, Object.assign(air(stand, 12), L('lN', 8, 110), L('lF', 8, 110), {'lN.f':60, 'lF.f':60, 'lN.w':0, 'lF.w':0}, both(30, -40), {t:-84})),
         K(o+0.37, Object.assign({}, stand, {hy:STAND+3}, both(40, 20)))];
    keys = [...base, ...mid2, ...back, ...finish].filter(k => k._t < 1);
  }
  return {face:1, dur:kind==='step' ? 6.5 : kind==='half' ? 3.8 : 5.2, still:kind==='full'||kind==='tuck' ? 0.46 : 0.5, keys,
    pins:[['aN.end', kind==='step' ? 0.24 : 0.2, kind==='step' ? 0.83 : 0.2 + (kind==='half' ? 0.32 : 0.5)]]};
}

/* ---- rendering ---- */
// Frame each move: a square viewBox (never smaller than 100 units, so every
// figure is drawn at the same scale) centred on everything the move touches.
function frameOf(def){
  if(def._vb) return def._vb;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const take = (x, y, r) => { x0 = Math.min(x0, x-r); x1 = Math.max(x1, x+r); y0 = Math.min(y0, y-r); y1 = Math.max(y1, y+r); };
  for(let i=0;i<48;i++){
    const q = pose(def, i/48), cx = q.cam;
    take(q.head[0]-cx, q.head[1], BONE.headR);
    Object.values(q.limbs).forEach(lb => [...lb.pts, lb.toe].forEach(pt => pt && take(pt[0]-cx, pt[1], 2.5)));
  }
  if(def.ext){ take(def.ext[0], def.ext[2], 1); take(def.ext[1], def.ext[2], 1); }
  const W = Math.max(100, x1-x0+12, y1-y0+12), cxm = (x0+x1)/2, cym = (y0+y1)/2;
  let y = def.view==='top' ? cym - W/2 : lerp(FLOOR+6-W, cym-W/2, 0.85);
  if(def.view!=='top') y = Math.max(Math.min(y, y0-5), FLOOR+5-W);
  return (def._vb = [cxm-W/2, y, W]);
}
function svgPts(pts){ return 'M' + pts.map(q => q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L'); }
function drawFig(svg, ph){
  const def = MOVES[svg.dataset.type];
  if(!def) return;
  const q = pose(def, ph), el = svg._el || (svg._el = {
    fig:svg.querySelector('.figure'), torso:svg.querySelector('.torso'), head:svg.querySelector('.head'),
    aN:svg.querySelector('.aN'), aF:svg.querySelector('.aF'), lN:svg.querySelector('.lN'), lF:svg.querySelector('.lF'),
    dyn:svg.querySelector('.dyn'), floor:svg.querySelector('.floor')});
  const cam = q.cam;
  el.fig.setAttribute('transform', cam ? `translate(${(-cam).toFixed(2)} 0)` : '');
  if(el.floor && (def.travel!==undefined || def.crawl)) el.floor.style.strokeDashoffset = cam.toFixed(2);
  const [H, S] = [q.H, q.S];
  let d;
  if(q.view==='head'){ d = svgPts([q.rF, q.rN]); q.head = [q.S[0], q.S[1] + 4.5]; }
  else if(q.c){
    const m = [(H[0]+S[0])/2, (H[1]+S[1])/2], nrm = dir(ang(H, S) - 90), cp = [m[0] + nrm[0]*q.c*2, m[1] + nrm[1]*q.c*2];
    d = `M${H[0].toFixed(1)} ${H[1].toFixed(1)}Q${cp[0].toFixed(1)} ${cp[1].toFixed(1)} ${S[0].toFixed(1)} ${S[1].toFixed(1)}`;
  } else d = svgPts([H, S]);
  if(def.bar && q.view!=='head') d += svgPts([q.rF, q.rN]);
  el.torso.setAttribute('d', d);
  el.head.setAttribute('cx', q.head[0].toFixed(1)); el.head.setAttribute('cy', q.head[1].toFixed(1));
  ['aN','aF','lN','lF'].forEach(id => {
    const lb = q.limbs[id], pts = lb.toe ? [...lb.pts, lb.toe] : lb.pts;
    el[id].setAttribute('d', q.view==='head' && id==='lN' ? '' : svgPts(pts));
  });
  if(el.dyn && def.dyn==='towel'){ const e = q.limbs.aN.pts[2]; el.dyn.setAttribute('d', svgPts([def.anchor, e])); }
}
function figureSVG(type){
  const def = MOVES[type] || MOVES.march;
  const travel = def.travel!==undefined || def.crawl;
  const [vx, vy, W] = frameOf(def);
  const floor = def.view==='top' ? '' : `<path class="floor${travel ? ' ticks' : ''}" d="M${(vx-20).toFixed(1)} ${FLOOR}H${(vx+W+20).toFixed(1)}"/>`;
  return `<svg class="fig t-${type}" data-type="${type}" viewBox="${[vx, vy, W, W].map(v => v.toFixed(1)).join(' ')}" aria-hidden="true">
    ${floor}${def.props || ''}${def.dyn ? '<path class="bar dyn"/>' : ''}
    <g class="figure"><path class="aF far"/><path class="lF far"/><path class="torso"/><circle class="head" r="${BONE.headR}"/><path class="lN"/><path class="aN"/></g>
  </svg>`;
}
/* FIGURE ENGINE END */

/* Animation loop: only figures in open rows are drawn, each from the moment
   its row opened (so a demo always starts at the beginning of a rep). With
   reduced motion every figure shows its key position, still. */
let figRAF = 0;
function figFrame(now){
  figRAF = 0;
  if(reduceMotion.matches) return;
  const figs = document.querySelectorAll('.exrow.open .fig');
  if(!figs.length) return;
  figs.forEach(svg => {
    if(!svg._t0) svg._t0 = now;
    const def = MOVES[svg.dataset.type];
    drawFig(svg, ((now - svg._t0)/(def.dur*1000)) % 1);
  });
  figRAF = requestAnimationFrame(figFrame);
}
function kickFigs(){ if(!figRAF && !reduceMotion.matches) figRAF = requestAnimationFrame(figFrame); }
function stillFig(svg){ svg._t0 = 0; drawFig(svg, MOVES[svg.dataset.type].still || 0); }
function initFigs(root){ root.querySelectorAll('.fig').forEach(stillFig); }

/* =========================================================
   WORKOUT PLAN + SET LOGGING
   Each move on a day gets a stable key (section letter + index).
   Circuit moves need one logged set per round; warm-up, cool-down
   and flow moves need one. Counts live in state.sets[day][key].
   ========================================================= */
const SECTION_LABEL = {w:"Warm-up", c:"Circuit", d:"Cool-down", f:"Flow"};
function dayPlan(w){
  const groups = [];
  const add = (sec, ids, target, workSec) =>
    groups.push({sec, items: ids.map((id,i)=>({key:sec+i, id, sec, target, workSec}))});
  if(w.flow){ add('f', w.flow, 1, 0); }
  else { add('w', w.warmup, 1, 0); add('c', w.circuit, w.rounds, w.workSec); add('d', w.cooldown, 1, 0); }
  return groups;
}
function planItems(plan){ return plan.flatMap(g=>g.items); }
function setCount(d, key){ return (state.sets[d] && state.sets[d][key]) || 0; }
function setCountTo(d, key, n){
  const s = state.sets[d] || (state.sets[d] = {});
  if(n>0) s[key] = n; else delete s[key];
  if(!Object.keys(s).length) delete state.sets[d];
}
function planTotals(plan, d){
  let done = 0, total = 0;
  planItems(plan).forEach(it=>{ total += it.target; done += Math.min(it.target, setCount(d, it.key)); });
  return {done, total};
}
/* What should the user do next? Warm-up in order, then the circuit
   round-robin (every move once per round), then cool-down. */
function nextUp(plan, d){
  for(const g of plan){
    if(g.sec==='c'){
      const counts = g.items.map(it=>setCount(d, it.key));
      const r = Math.min(...counts);
      if(r < g.items[0].target){ const i = counts.indexOf(r); return {item:g.items[i], round:r+1}; }
    } else {
      const it = g.items.find(it=>setCount(d, it.key) < it.target);
      if(it) return {item:it, round:1};
    }
  }
  return null;
}

/* =========================================================
   RENDER — full rebuild only when the day changes. Logging a
   set, timers and completion update the existing DOM in place
   (refresh) so every state change can transition, not snap.
   ========================================================= */
const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
if(reduceMotion.addEventListener) reduceMotion.addEventListener('change', () => { document.querySelectorAll('.fig').forEach(stillFig); kickFigs(); });
let view = null;          // {w, plan} for the day on screen
let navDir = 0;
let lastCurrentKey = null;
const openRows = new Set();

const CHECK_PATH = `<path d="M6 12.5l4 4L18 8" pathLength="1"/>`;

function render(){
  stopTimer();
  const w = getWorkout(state.day);
  const plan = dayPlan(w);
  view = {w, plan};
  openRows.clear();
  lastCurrentKey = null;
  const app = document.getElementById('app');
  const catColor = `var(${CAT[w.cat].css})`;
  app.style.setProperty('--cat', catColor);
  document.getElementById('nowbar').style.setProperty('--cat', catColor);
  document.getElementById('toast').classList.remove('show');

  let html = `
    <div class="brand"><h1>Morning Calisthenics</h1><div class="tag">MEN'S PROGRAM · 12 WEEKS</div></div>
    <div class="dayhead" style="color:${catColor}">
      <div class="phaseline" style="color:var(--chalk-dim)">${w.phase.name.toUpperCase()} · ${w.phase.weeks}</div>
      <div class="dayrow">
        <p class="daynum">DAY ${state.day}<span class="daysub">of 84 · Week ${w.week}, Day ${w.dow}</span></p>
        <div class="stamp" aria-hidden="true"><svg viewBox="0 0 24 24">${CHECK_PATH}</svg></div>
      </div>
      <div class="focusrow">
        <div class="badge" style="color:${catColor}">${w.title || CAT[w.cat].label}</div>
        <div class="meta">${w.circuit ? `~15 min · ${w.rounds} rounds · ${w.workSec}s work / ${w.restSec}s rest` : "~15 min flow"}</div>
      </div>
      <div class="track" role="progressbar" aria-label="Sets logged today" aria-valuemin="0">
        ${plan.map(g=>{
          const n = g.items.reduce((a,it)=>a+it.target,0);
          return `<div class="tgroup ${g.sec==='c'||g.sec==='f'?'':'soft'}" data-sec="${g.sec}" style="flex:${n}">${'<i class="seg"></i>'.repeat(n)}</div>`;
        }).join('')}
      </div>
      <div class="trackmeta"><span class="tcount"></span><span class="tnext"></span></div>
      <div class="navrow">
        <button class="navbtn press" onclick="changeDay(-1)">◀ Prev</button>
        <button class="navbtn press" id="donebtn" onclick="toggleComplete()"></button>
        <button class="navbtn press" onclick="changeDay(1)">Next ▶</button>
      </div>
    </div>

    <div class="weekstrip">`;
  const weekStart = (w.week-1)*7+1;
  for(let i=0;i<7;i++){
    const dnum = weekStart+i;
    const dw = getWorkout(dnum);
    const active = dnum===state.day ? 'active' : '';
    html += `<button class="chip cat press ${active}" data-day="${dnum}" style="--cat:var(${CAT[dw.cat].css})" onclick="jumpTo(${dnum})" aria-label="Day ${dnum}, ${dw.title}">${dnum}<span class="tick"><svg viewBox="0 0 24 24">${CHECK_PATH}</svg></span></button>`;
  }
  html += `</div>`;

  let i = 0; // stagger index for the entrance animation
  const section = (g, title, info, color, workSec) => {
    const s = `<div class="section" data-sec="${g.sec}">
      <div class="sectitle" style="color:${color}; --i:${i++}"><span class="dot"></span>${title}<span class="secmeta"></span></div>
      <div class="circuitinfo" style="--i:${i++}">${info}</div>
      ${exList(g.items, workSec, ()=>i++)}</div>`;
    return s;
  };
  if(w.flow){
    html += section(plan[0], w.title, `${w.note} · ~${Math.round(w.flow.length*w.flowSec/60)} min total`, catColor);
  } else {
    html += section(plan[0], 'Warm-up', '2 rounds · 30–40s each, easy pace', 'var(--chalk)');
    html += section(plan[1], `${w.title} — Circuit`, `${w.rounds} rounds through all 3 · ${w.workSec}s work / ${w.restSec}s rest`, catColor, w.workSec);
    html += section(plan[2], 'Cool-down', 'Hold each stretch 40–45s per side', 'var(--chalk)');
  }

  html += `<div class="footnote" style="--i:${i}"><b>${w.phase.name} phase</b> (${w.phase.weeks}): ${w.phase.blurb} Tap any move for a quick animated demo and form cue; tap the circle to log it.</div>`;

  app.innerHTML = html;
  initFigs(app);

  // entrance: slide from the direction you navigated
  app.dataset.dir = navDir>0 ? 'next' : navDir<0 ? 'prev' : 'load';
  navDir = 0;
  app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
  clearTimeout(render.enterT);
  // drop the class once finished so later state animations never replay it
  render.enterT = setTimeout(()=>app.classList.remove('enter'), 900);

  refresh({initial:true});
}

function exList(items, workSec, nextI){
  return `<div class="exlist">` + items.map(it=>{
    const ex = EX[it.id];
    const pips = it.target>1 ? `<span class="pips" aria-hidden="true">${'<i></i>'.repeat(it.target)}</span>` : '';
    return `
    <div class="exrow" id="row-${it.key}" data-key="${it.key}" style="--i:${nextI()}">
      <div class="exhead">
        <button class="extoggle" aria-expanded="false" aria-controls="body-${it.key}" onclick="toggleEx('${it.key}')">
          <span class="exmain">
            <span class="exname">${ex.name}</span>
            <span class="exsub"><span class="nowtag">Now</span><span>${workSec ? workSec+'s work' : 'Hold / flow pace'}</span>${pips}</span>
          </span>
          <span class="exchev">▾</span>
        </button>
        <button class="check" onclick="tapCheck('${it.key}')">
          <span class="ck">
            <svg viewBox="0 0 34 34"><circle class="ck-bg" cx="17" cy="17" r="15"/><circle class="ck-track" cx="17" cy="17" r="15"/><circle class="ck-ring" cx="17" cy="17" r="15" pathLength="1"/></svg>
            <svg class="ck-mark" viewBox="0 0 34 34"><path d="M11 17.5l4 4 8-8.5" pathLength="1"/></svg>
            <span class="ck-count"></span>
          </span>
        </button>
      </div>
      <div class="exbody" id="body-${it.key}">
        <div class="exclip"><div class="exinner">
          <div class="stagebox">${figureSVG(ex.type)}</div>
          <div class="cuecol">
            <div class="cue">${ex.cue}</div>
            ${workSec ? `<button class="timerbtn press" onclick="runTimer('${it.key}')">Start ${workSec}s</button>` : ``}
          </div>
        </div></div>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function setOpen(key, open){
  const row = document.getElementById('row-'+key);
  if(!row) return;
  row.classList.toggle('open', open);
  const fig = row.querySelector('.fig');
  if(fig){ stillFig(fig); if(open) kickFigs(); }
  row.querySelector('.extoggle').setAttribute('aria-expanded', open);
  if(open) openRows.add(key); else openRows.delete(key);
}
function toggleEx(key){ setOpen(key, !openRows.has(key)); }

/* Sync every piece of day UI to state. opts.logged = key just logged,
   opts.celebrate = the day just became complete. */
function refresh(opts={}){
  if(!view) return;
  const d = state.day, {plan} = view;
  const next = nextUp(plan, d);
  const curKey = next && !state.completed[d] ? next.item.key : null;
  const cur = next ? next.item : null;

  planItems(plan).forEach(it=>{
    const row = document.getElementById('row-'+it.key);
    const c = Math.min(it.target, setCount(d, it.key));
    const done = c >= it.target;
    const wasDone = row.classList.contains('is-done');
    row.classList.toggle('is-done', done);
    row.classList.toggle('is-current', it.key===curKey);
    row.querySelector('.ck-ring').style.strokeDashoffset = 1 - c/it.target; row.querySelector('.ck-ring').style.opacity = c>0 ? 1 : 0;
    row.querySelector('.ck-count').textContent = it.target>1 && c>0 && !done ? c : '';
    row.querySelectorAll('.pips i').forEach((p,i)=>p.classList.toggle('on', i<c));
    const name = EX[it.id].name;
    row.querySelector('.check').setAttribute('aria-label', done
      ? `${name} done. Tap to reset`
      : it.target>1 ? `Log round ${c+1} of ${it.target} for ${name}` : `Mark ${name} done`);
    row.querySelector('.check').setAttribute('aria-pressed', done);
    if(opts.logged===it.key){
      flash(row, 'just-logged', 500);
      if(done && !wasDone){ flash(row, 'just-done', 700); if(openRows.has(it.key)) setOpen(it.key, false); }
    }
  });

  // current move: expand it, lift it in, and bring it into view
  if(curKey && curKey!==lastCurrentKey){
    if(lastCurrentKey && !opts.initial) setOpen(lastCurrentKey, false);
    const row = document.getElementById('row-'+curKey);
    if(!opts.initial) flash(row, 'became-current', 450);
    setOpen(curKey, true);
    if(!opts.initial && !opts.celebrate) revealRow(row);
  }
  lastCurrentKey = curKey;

  // sections
  plan.forEach(g=>{
    const sec = document.querySelector(`.section[data-sec="${g.sec}"]`);
    const meta = sec.querySelector('.secmeta');
    if(g.sec==='c'){
      const r = Math.min(...g.items.map(it=>setCount(d,it.key)));
      const target = g.items[0].target;
      meta.textContent = r>=target ? `✓ ${target}/${target} rounds` : `Round ${r+1}/${target}`;
      sec.classList.toggle('sec-done', r>=target);
    } else {
      const n = g.items.filter(it=>setCount(d,it.key)>=it.target).length;
      meta.textContent = n===g.items.length ? `✓ ${n}/${n}` : `${n}/${g.items.length}`;
      sec.classList.toggle('sec-done', n===g.items.length);
    }
  });

  // set track
  const {done, total} = planTotals(plan, d);
  plan.forEach(g=>{
    const segs = document.querySelectorAll(`.tgroup[data-sec="${g.sec}"] .seg`);
    const filled = g.items.reduce((a,it)=>a+Math.min(it.target, setCount(d,it.key)),0);
    segs.forEach((s,i)=>{
      const on = i<filled;
      if(on && !s.classList.contains('on') && !opts.initial) flash(s, 'pop', 550);
      s.classList.toggle('on', on);
    });
  });
  const track = document.querySelector('.track');
  track.setAttribute('aria-valuemax', total);
  track.setAttribute('aria-valuenow', done);
  const tcount = document.querySelector('.tcount');
  tcount.innerHTML = `<b>${done}</b> / ${total} sets`;
  if(opts.logged) flash(tcount.querySelector('b'), 'bump', 400);
  document.querySelector('.tnext').textContent = state.completed[d] ? 'Day complete' : done===0 ? "Let's go" : `${total-done} to go`;

  // day header + done button + week chip
  const dayDone = !!state.completed[d];
  const head = document.querySelector('.dayhead');
  head.classList.toggle('is-done', dayDone);
  const btn = document.getElementById('donebtn');
  btn.textContent = dayDone ? '✓ Done' : 'Mark Done';
  btn.classList.toggle('complete', dayDone);
  btn.setAttribute('aria-pressed', dayDone);
  document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('done', !!state.completed[+ch.dataset.day]));
  if(opts.celebrate){
    flash(head, 'celebrate', 1400);
    const chip = document.querySelector(`.chip[data-day="${d}"]`);
    if(chip) flash(chip, 'just-done', 1000);
  }

  updateNowbar(opts);
}

/* restart a one-shot CSS animation class */
function flash(el, cls, ms){
  if(!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  clearTimeout(el['_t'+cls]);
  el['_t'+cls] = setTimeout(()=>el.classList.remove(cls), ms);
}
function scrollBehavior(){ return reduceMotion.matches ? 'auto' : 'smooth'; }
function revealRow(row){
  // wait for the previous row's collapse to settle before measuring
  setTimeout(()=>{
    const r = row.getBoundingClientRect();
    const barTop = document.querySelector('.nb').getBoundingClientRect().top;
    if(r.top < 12 || r.top + Math.min(r.height, 200) > barTop - 8){
      window.scrollTo({top: window.scrollY + r.top - 90, behavior: scrollBehavior()});
    }
  }, 320);
}

/* =========================================================
   LOGGING — tapCheck is the row's circle button.
   ========================================================= */
const tapLock = {};
function itemFor(key){ return planItems(view.plan).find(it=>it.key===key); }
function snapshot(){
  const d = state.day;
  return {d, sets: state.sets[d] ? {...state.sets[d]} : null, completed: !!state.completed[d]};
}
function restore(snap){
  if(snap.sets) state.sets[snap.d] = snap.sets; else delete state.sets[snap.d];
  if(snap.completed) state.completed[snap.d] = true; else delete state.completed[snap.d];
  saveState();
  if(snap.d===state.day){ stopTimer(); refresh(); }
}
function tapCheck(key){
  // Swallow a second tap on the same circle for a beat: collapsing rows
  // shift the layout and a double-tap must not undo what was just logged.
  const now = Date.now();
  if(tapLock[key] > now) return;
  tapLock[key] = now + 600;
  const it = itemFor(key), d = state.day;
  if(setCount(d, key) >= it.target){
    const snap = snapshot();
    const allBefore = planTotals(view.plan, d);
    setCountTo(d, key, 0);
    if(allBefore.done===allBefore.total) delete state.completed[d];
    saveState(); refresh();
    showToast(`${EX[it.id].name} reset`, ()=>restore(snap));
  } else {
    logSet(key);
  }
}
function logSet(key, fromTimer){
  const it = itemFor(key), d = state.day;
  if(!fromTimer && timer.key===key) stopTimer();
  if(setCount(d, key) >= it.target) return updateNowbar({swap:true}); // already complete
  const snap = snapshot();
  const c = setCount(d, key) + 1;
  setCountTo(d, key, c);
  const {done, total} = planTotals(view.plan, d);
  const celebrate = done===total && !state.completed[d];
  if(celebrate) state.completed[d] = true;
  saveState();
  buzz(celebrate ? [14,70,28] : 12);
  refresh({logged:key, celebrate});
  if(celebrate) celebrateDay();
  const what = it.target>1 ? `Round ${c}/${it.target} logged` : 'Logged';
  showToast(celebrate ? `Day ${d} complete · ${total} sets` : `${what} · ${EX[it.id].name}`, ()=>restore(snap));
}
function celebrateDay(){
  chime();
  const head = document.querySelector('.dayhead');
  if(head.getBoundingClientRect().top < -40){
    window.scrollTo({top:0, behavior: scrollBehavior()});
    // replay the stamp once the header is back on screen
    setTimeout(()=>flash(head, 'celebrate', 1400), reduceMotion.matches ? 0 : 450);
  }
}

let toastT = null, toastUndo = null;
function showToast(msg, undo){
  const t = document.getElementById('toast');
  t.querySelector('span').textContent = msg;
  toastUndo = undo;
  t.querySelector('button').hidden = !undo;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, 3200);
}
function hideToast(){ document.getElementById('toast').classList.remove('show'); toastUndo = null; }
function undoToast(){ const u = toastUndo; hideToast(); if(u) u(); }

function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* =========================================================
   NAVIGATION
   ========================================================= */
function changeDay(delta){
  const d = Math.min(84, Math.max(1, state.day+delta));
  if(d===state.day) return;
  navDir = delta;
  state.day = d;
  saveState(); render();
  window.scrollTo({top:0, behavior: scrollBehavior()});
}
function jumpTo(d){
  if(d===state.day) return;
  navDir = d>state.day ? 1 : -1;
  state.day = d; saveState(); render();
}
function toggleComplete(){
  const d = state.day;
  if(state.completed[d]){ delete state.completed[d]; saveState(); refresh(); return; }
  stopTimer();
  state.completed[d] = true;
  saveState();
  buzz([14,70,28]);
  refresh({celebrate:true});
  chime();
}

/* =========================================================
   TIMER — work → rest → next. Time is measured from wall-clock
   timestamps, so a throttled background tab or a locked phone
   catches up correctly instead of drifting.
   ========================================================= */
const timer = {phase:'idle', key:null, start:0, end:0, handle:null, lastSec:null, go:false};
let wakeLock = null;

function runTimer(key){
  // Tapping the running timer stops it; starting another replaces it.
  if(timer.phase==='work' && timer.key===key){ stopTimer(); return; }
  startWork(key);
}
function startWork(key, at){
  const it = itemFor(key);
  if(!it || !it.workSec) return;
  unlockAudio();
  clearInterval(timer.handle);
  const now = at || Date.now();
  Object.assign(timer, {phase:'work', key, start:now, end:now + it.workSec*1000, lastSec:null, go:false});
  if(!openRows.has(key)) setOpen(key, true);
  requestWake();
  timer.handle = setInterval(tick, 200);
  updateNowbar({swap:true});
  tick();
}
function startRest(nextKey, from){
  const sec = view.w.restSec;
  Object.assign(timer, {phase:'rest', key:nextKey, start:from, end:from + sec*1000, lastSec:null});
  updateNowbar({swap:true});
}
function stopTimer(){
  clearInterval(timer.handle);
  const was = timer.phase;
  Object.assign(timer, {phase:'idle', key:null, handle:null, go:false});
  releaseWake();
  if(was!=='idle' && view) updateNowbar({swap:true});
}
function tick(){
  const now = Date.now();
  if(now >= timer.end){
    if(timer.phase==='work'){
      const endedAt = timer.end, key = timer.key;
      beep(880, 0.22);
      clearInterval(timer.handle);
      timer.phase = 'idle'; timer.key = null;
      logSet(key, true);
      const next = !state.completed[state.day] && nextUp(view.plan, state.day);
      if(next && next.item.sec==='c' && view.w.restSec){
        startRest(next.item.key, endedAt);
        timer.handle = setInterval(tick, 200);
        return tick();
      }
      releaseWake();
      return updateNowbar({swap:true});
    }
    if(timer.phase==='rest'){
      clearInterval(timer.handle);
      beep(660, 0.12); setTimeout(()=>beep(990, 0.2), 150);
      buzz([20,60,20]);
      Object.assign(timer, {phase:'idle', key:null, go:true});
      releaseWake();
      return updateNowbar({swap:true});
    }
    return;
  }
  const remain = Math.ceil((timer.end - now)/1000);
  const frac = (timer.end - now) / (timer.end - timer.start);
  const nb = document.getElementById('nowbar');
  nb.querySelector('.rg-arc').style.strokeDashoffset = 1 - frac;
  if(remain !== timer.lastSec){
    timer.lastSec = remain;
    nb.querySelector('.nb-num').textContent = remain;
    const inline = document.querySelector(`#row-${timer.key} .timerbtn`);
    if(inline && timer.phase==='work') inline.textContent = `Stop · ${remain}s`;
    if(remain<=3){ flash(nb.querySelector('.nb-ring'), 'tick', 430); beep(timer.phase==='work' ? 520 : 440, 0.06); }
  }
}

const ICON_PLAY = `<svg viewBox="0 0 24 24"><path class="play" d="M8 5.5v13l11-6.5z"/></svg>`;
const ICON_CHECK = `<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4L18.5 7.5"/></svg>`;

function updateNowbar(opts={}){
  const nb = document.getElementById('nowbar');
  if(!view){ nb.classList.remove('show'); return; }
  const d = state.day, {w, plan} = view;
  const text = nb.querySelector('.nb-text'), label = nb.querySelector('.nb-label'),
        name = nb.querySelector('.nb-name'), num = nb.querySelector('.nb-num'),
        arc = nb.querySelector('.rg-arc'), action = nb.querySelector('.nb-action');
  let phase = timer.phase;
  const next = nextUp(plan, d);
  if(phase==='idle') phase = state.completed[d] || !next ? 'done' : 'ready';
  const roundTxt = (it, r) => it.target>1 ? `Round ${r}/${it.target}` : SECTION_LABEL[it.sec];

  document.querySelectorAll('.timerbtn').forEach(b=>{
    const key = b.closest('.exrow').dataset.key;
    const on = timer.phase==='work' && timer.key===key;
    b.classList.toggle('running', on);
    if(!on) b.textContent = `Start ${w.workSec}s`;
  });

  let key = null, act = null, actLabel = '', ghost = false;
  if(phase==='work'){
    const it = itemFor(timer.key);
    const r = Math.min(it.target, setCount(d, it.key)+1);
    label.textContent = `Work · ${roundTxt(it, r)}`;
    name.textContent = EX[it.id].name;
    key = it.key; act = stopTimer; actLabel = 'Stop'; ghost = true;
    num.textContent = Math.ceil((timer.end-Date.now())/1000);
  } else if(phase==='rest'){
    const it = itemFor(timer.key);
    label.textContent = 'Rest · next up';
    name.textContent = EX[it.id].name;
    key = it.key; act = ()=>{ stopTimer(); timer.go = false; }; actLabel = 'Skip'; ghost = true;
    num.textContent = Math.ceil((timer.end-Date.now())/1000);
  } else if(phase==='ready'){
    const it = next.item;
    label.textContent = `${timer.go ? 'Go' : 'Next'} · ${roundTxt(it, next.round)}`;
    name.textContent = EX[it.id].name;
    key = it.key;
    if(it.workSec){ act = ()=>startWork(it.key); actLabel = `Start ${it.workSec}s`; num.innerHTML = ICON_PLAY; }
    else { act = ()=>tapCheck(it.key); actLabel = 'Done'; num.innerHTML = ICON_CHECK; }
    arc.style.strokeDashoffset = 1;
  } else {
    label.textContent = `Day ${d} complete`;
    if(d<84){
      const nw = getWorkout(d+1);
      name.textContent = `Next: Day ${d+1} · ${nw.title}`;
      act = ()=>changeDay(1); actLabel = `Day ${d+1} →`;
    } else {
      name.textContent = 'Program complete. 84 days.';
    }
    num.innerHTML = ICON_CHECK;
    arc.style.strokeDashoffset = 0;
  }
  if(phase==='work' || phase==='rest') arc.style.strokeDashoffset = 1 - (timer.end-Date.now())/(timer.end-timer.start);
  arc.style.opacity = phase==='ready' ? 0 : 1;

  const changed = nb.dataset.phase !== phase || nb.dataset.key !== String(key);
  nb.dataset.phase = phase;
  nb.dataset.key = String(key);
  nb.classList.toggle('go', phase==='ready' && timer.go);
  if(changed && (opts.swap || opts.logged || opts.celebrate)) flash(text, 'swap', 340);
  action.textContent = actLabel;
  action.hidden = !act;
  action.classList.toggle('ghost', ghost);
  nowAction = act;
  nowKey = key;
  nb.classList.add('show');
}
let nowAction = null, nowKey = null;
function nowbarAction(){ if(nowAction) nowAction(); }
function nowbarReveal(){
  if(!nowKey) return;
  const row = document.getElementById('row-'+nowKey);
  if(!openRows.has(nowKey)) setOpen(nowKey, true);
  window.scrollTo({top: window.scrollY + row.getBoundingClientRect().top - 90, behavior: scrollBehavior()});
}

/* screen stays on while a timer runs (where supported) */
async function requestWake(){
  try{ if('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    if(timer.phase!=='idle'){ wakeLock = null; requestWake(); tick(); }
  }
});

/* =========================================================
   SOUND — one shared AudioContext, unlocked on the first tap
   (iOS only allows audio that starts from a user gesture).
   ========================================================= */
let audioCtx = null;
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(freq=660, dur=0.22, when=0, vol=0.08){
  try{
    if(!audioCtx) unlockAudio();
    const t = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function chime(){ beep(523, 0.18, 0, 0.06); beep(659, 0.18, 0.1, 0.06); beep(784, 0.4, 0.2, 0.07); }
loadState();
</script>
