<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#182420">
<meta name="description" content="Tell us how much time you have. We'll build the calisthenics workout.">
<title>Calisthenics: your time, your workout</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calisthenics">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ================= design tokens ================= */
:root{
  --bg:#182420; --bg-deep:#121C18;
  --s1:#1F2C27; --s2:#26352F; --s3:#2F4039;
  --line:rgba(241,243,236,0.10); --line-2:rgba(241,243,236,0.20);
  --chalk:#F1F3EC; --dim:#A3AFA3; --mute:#7E8D82;
  --sun:#FF8659; --sun-2:#F6D860;
  --grad:linear-gradient(135deg, var(--sun-2) 0%, var(--sun) 100%);
  --push:#FF8659; --pull:#F6D860; --legs:#7FD99A; --core:#5FB8E8; --full:#FF6B6B; --mob:#B79CF0;
  --ok:#7FD99A; --warn:#F6D860; --bad:#FF7A6B;
  --r-sm:10px; --r:16px; --r-lg:22px;
  --out:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --display:'Oswald', 'Arial Narrow', sans-serif; --body:'Work Sans', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--chalk);}
body{font-family:var(--body); font-size:15px; line-height:1.45; min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
button:disabled{opacity:0.5; cursor:default;}
button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--sun-2); outline-offset:3px; border-radius:8px;}
a{color:inherit;}
h1,h2,h3,p{margin:0;}
.screen{display:none; min-height:100vh; min-height:100dvh;}
.screen.active{display:block; animation:screenIn 320ms var(--out);}
@keyframes screenIn{from{opacity:0; transform:translateY(8px);}}
.wrap{max-width:560px; margin:0 auto; padding:calc(14px + var(--safe-t)) 16px calc(120px + var(--safe-b));}
.eyebrow{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim);}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.press{transition:transform 140ms var(--out), background-color 200ms ease, border-color 200ms ease, opacity 200ms ease;}
.press:active{transform:scale(0.96);}
[hidden]{display:none !important;}
.blk{display:block;}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 20px; border-radius:14px;
  font-family:var(--display); font-weight:600; font-size:16px; letter-spacing:1.2px; text-transform:uppercase; text-align:center;}
.btn-primary{background:var(--grad); color:#1A140F; box-shadow:0 12px 28px -14px rgba(255,134,89,0.9);}
.btn-ghost{border:1.5px solid var(--line-2); color:var(--chalk); background:rgba(241,243,236,0.03);}
.btn-quiet{color:var(--dim); min-height:44px; padding:0 12px; font-size:14px;}
.btn-danger{border:1.5px solid color-mix(in srgb, var(--bad) 60%, transparent); color:var(--bad);}
.btn-block{width:100%;}
.btn small{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:0.3px; opacity:0.7; text-transform:none;}
.icon-btn{flex:0 0 auto; width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--chalk); background:rgba(241,243,236,0.07);}
.icon-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.chip{min-height:40px; padding:0 16px; border-radius:100px; border:1.5px solid var(--line-2); color:var(--dim); font-weight:500; font-size:14px; white-space:nowrap;}
.chip[aria-pressed="true"]{border-color:var(--chalk); color:var(--bg); background:var(--chalk);}

/* ================= top bar ================= */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; min-height:44px;}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:2px; text-transform:uppercase;}
.brand-mark{width:28px; height:28px; border-radius:8px; background:var(--grad); display:inline-block; position:relative; overflow:hidden;}
.brand-mark::after{content:""; position:absolute; left:5px; right:5px; bottom:9px; height:3px; border-radius:2px; background:#182420; transform:rotate(-14deg);}
.topbar .actions{display:flex; gap:8px;}

/* ================= home ================= */
.hero h1{font-family:var(--display); font-weight:700; font-size:clamp(32px, 9.5vw, 42px); line-height:1.02; letter-spacing:0.5px; text-transform:uppercase;}
.hero h1 span{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{color:var(--dim); margin-top:8px; font-size:15px;}

.timecard{margin-top:20px; padding:18px 18px 18px; border-radius:var(--r-lg); background:linear-gradient(180deg, var(--s2), var(--s1)); border:1px solid var(--line);}
.time-readout{display:flex; align-items:baseline; justify-content:center; gap:10px; margin:6px 0 4px;}
.time-num{font-family:var(--display); font-weight:700; font-size:96px; line-height:0.95; letter-spacing:-1px; font-variant-numeric:tabular-nums;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.time-unit{font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:2px; color:var(--dim); text-transform:uppercase;}
.time-num.bump{animation:bump 240ms var(--out);}
@keyframes bump{40%{transform:scale(1.05);}}

/* range: big thumb for thumbs */
.range{-webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; margin:4px 0 0; --p:20%; touch-action:pan-y;}
.range::-webkit-slider-runnable-track{height:8px; border-radius:8px; background:linear-gradient(90deg, var(--sun-2), var(--sun) var(--p), rgba(241,243,236,0.12) var(--p));}
.range::-moz-range-track{height:8px; border-radius:8px; background:linear-gradient(90deg, var(--sun-2), var(--sun) var(--p), rgba(241,243,236,0.12) var(--p));}
.range::-webkit-slider-thumb{-webkit-appearance:none; width:30px; height:30px; margin-top:-11px; border-radius:50%; background:var(--chalk); border:0; box-shadow:0 4px 14px rgba(0,0,0,0.5), 0 0 0 5px rgba(255,134,89,0.25);}
.range::-moz-range-thumb{width:30px; height:30px; border-radius:50%; background:var(--chalk); border:0; box-shadow:0 4px 14px rgba(0,0,0,0.5);}
.range-ends{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--mute);}
.presets{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin-top:14px;}
.preset{min-height:44px; border-radius:12px; border:1.5px solid var(--line-2); font-family:var(--mono); font-weight:600; font-size:14px; color:var(--dim); font-variant-numeric:tabular-nums;}
.preset[aria-pressed="true"]{border-color:transparent; background:var(--chalk); color:var(--bg);}

.focusrow{display:flex; gap:8px; overflow-x:auto; margin:10px -16px 0; padding:2px 16px 4px; scrollbar-width:none;}
.focusrow::-webkit-scrollbar{display:none;}
.focus-label{margin:20px 0 0; display:flex; justify-content:space-between; align-items:center; gap:8px;}
.focus-label .btn-quiet{padding:0 2px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:3px;}

/* session preview */
.preview{margin-top:16px; border-radius:var(--r-lg); background:var(--s1); border:1px solid var(--line); overflow:hidden;}
.pv-head{padding:18px 14px 0 18px; display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
.pv-title{font-family:var(--display); font-weight:600; font-size:25px; line-height:1.1; letter-spacing:0.3px; text-transform:uppercase; margin-top:4px;}
.pv-sub{color:var(--dim); font-size:13.5px; margin-top:6px;}
.pv-reason{margin:12px 18px 0; padding:10px 12px; border-radius:12px; background:rgba(241,243,236,0.05); color:var(--chalk); font-size:13.5px; display:flex; gap:10px; align-items:flex-start;}
.pv-reason::before{content:""; flex:0 0 8px; height:8px; margin-top:6px; border-radius:50%; background:var(--grad);}
.timeline{display:flex; gap:3px; margin:16px 18px 8px; height:8px;}
.timeline i{display:block; border-radius:3px; background:var(--c, var(--mute)); min-width:4px;}
.tl-legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin:0 18px; font-family:var(--mono); font-size:11px; color:var(--dim);}
.tl-legend span{white-space:nowrap;}
.tl-legend span::before{content:""; display:inline-block; width:7px; height:7px; border-radius:2px; background:var(--c); margin-right:6px; vertical-align:1px;}
.pv-list{list-style:none; margin:12px 0 0; padding:0 8px 8px;}
.pv-item{display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:12px; width:100%; text-align:left; min-height:56px;}
.pv-item:active{background:rgba(241,243,236,0.05);}
.thumb{flex:0 0 46px; height:46px; border-radius:11px; background:var(--bg-deep); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.thumb svg{width:40px; height:40px; overflow:visible;}
.pv-item .nm{font-weight:600; font-size:14.5px;}
.pv-item .dx{font-family:var(--mono); font-size:11.5px; color:var(--dim); margin-top:1px;}
.pv-item .txt{flex:1; min-width:0;}
.pv-item .tag{font-family:var(--mono); font-size:10.5px; color:var(--c, var(--dim)); border:1px solid currentColor; border-radius:6px; padding:1px 6px; white-space:nowrap; opacity:0.9;}
.pv-foot{display:flex; border-top:1px solid var(--line);}
.pv-foot button{flex:1; min-height:52px; font-weight:600; font-size:14px; color:var(--chalk);}
.pv-notes{margin:2px 18px 14px; color:var(--dim); font-size:12.5px;}
.pv-notes p + p{margin-top:6px;}
.pv-more{color:var(--dim); font-size:12.5px; padding:2px 10px 4px;}

.recent{margin-top:16px; padding:14px 16px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line); display:flex; align-items:center; gap:14px; width:100%; text-align:left;}
.recent .txt{flex:1; min-width:0;}
.recent .t1{font-weight:600; font-size:14px;}
.recent .t2{color:var(--dim); font-size:12.5px; margin-top:2px;}
.week{display:flex; gap:4px; flex:0 0 auto;}
.week i{width:8px; height:22px; border-radius:3px; background:rgba(241,243,236,0.10);}
.week i.on{background:var(--grad);}
.recovery{display:flex; gap:4px 12px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--dim);}
.recovery span::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--c); vertical-align:1px;}

.resume{margin-bottom:16px; padding:14px 14px 14px 16px; border-radius:var(--r); background:color-mix(in srgb, var(--sun) 14%, var(--s1)); border:1px solid color-mix(in srgb, var(--sun) 45%, transparent); display:flex; gap:12px; align-items:center;}
.resume .txt{flex:1; min-width:0;}
.resume .t1{font-weight:600;}
.resume .t2{font-size:13px; color:var(--dim);}

/* sticky call to action */
.cta{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:16px 16px calc(14px + var(--safe-b)); background:linear-gradient(180deg, rgba(24,36,32,0), var(--bg) 34%);}
.cta > .btn, .cta > .cta-row{width:100%; max-width:528px; margin:0 auto; display:flex; min-height:60px; font-size:18px;}
.cta-row{gap:10px;}

/* ================= plan screen ================= */
.subhead{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.subhead h2{font-family:var(--display); font-weight:600; font-size:20px; letter-spacing:1px; text-transform:uppercase; flex:1;}
.block{margin-top:20px;}
.block-h{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; padding:0 4px 8px; border-bottom:1px solid var(--line);}
.block-h h3{font-family:var(--display); font-weight:600; font-size:16px; letter-spacing:1.4px; text-transform:uppercase; color:var(--c, var(--chalk));}
.block-h .meta{font-family:var(--mono); font-size:11px; color:var(--dim); text-align:right; line-height:1.5;}
.plan-meta{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px;}
.pill{font-family:var(--mono); font-size:11.5px; padding:4px 10px; border-radius:100px; background:rgba(241,243,236,0.07); color:var(--dim);}
.safety{margin-top:22px; font-size:12.5px; color:var(--mute); line-height:1.55;}

/* ================= player ================= */
#player{position:fixed; inset:0; z-index:40; background:var(--bg-deep); overflow:hidden;}
#player.active{display:flex; flex-direction:column; animation:none;}
.pl-top{display:flex; align-items:center; gap:12px; padding:calc(10px + var(--safe-t)) 14px 6px; max-width:640px; width:100%; margin:0 auto;}
.pl-prog{flex:1; min-width:0;}
.pl-bar{display:flex; gap:3px; height:6px;}
.pl-bar span{flex:var(--w); border-radius:3px; background:rgba(241,243,236,0.12); position:relative; overflow:hidden; min-width:3px;}
.pl-bar span i{position:absolute; inset:0; background:var(--grad); transform-origin:left; transform:scaleX(var(--f, 0)); transition:transform 400ms var(--out);}
.pl-meta{display:flex; justify-content:space-between; margin-top:7px; font-family:var(--mono); font-size:11.5px; color:var(--dim); gap:8px;}
.pl-meta span:first-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pl-main{flex:1; display:flex; flex-direction:column; max-width:640px; width:100%; margin:0 auto; min-height:0; padding:0 16px;}
.pl-stage{flex:1 1 auto; min-height:120px; position:relative; display:flex; align-items:center; justify-content:center; border-radius:var(--r-lg);
  background:radial-gradient(ellipse at 50% 72%, rgba(241,243,236,0.06), transparent 65%), var(--bg); margin-top:6px; overflow:hidden; padding:8px;}
.pl-stage svg{width:100%; height:100%; max-height:340px; overflow:visible;}
.pl-stage .stage-tag{position:absolute; left:12px; top:12px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--dim);
  background:rgba(18,28,24,0.8); padding:4px 8px; border-radius:8px;}
#player[data-phase="rest"] .stage-tag{color:var(--sun-2);}
.pl-stage .side-tag{position:absolute; right:12px; top:12px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#1A140F; background:var(--sun-2); padding:4px 8px; border-radius:8px;}
.pl-info{padding:12px 2px 0; text-align:center;}
.pl-kicker{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--dim);}
#player[data-phase="rest"] .pl-kicker, #player[data-phase="prep"] .pl-kicker{color:var(--sun-2);}
.pl-name{font-family:var(--display); font-weight:600; font-size:clamp(25px, 7.2vw, 34px); line-height:1.08; letter-spacing:0.3px; margin-top:4px; text-transform:uppercase;}
.pl-target{font-family:var(--display); font-weight:700; font-size:clamp(52px, 15vw, 74px); line-height:1; margin-top:6px; font-variant-numeric:tabular-nums;}
.pl-target small{font-size:0.32em; font-weight:600; letter-spacing:2px; color:var(--dim); margin-left:8px; text-transform:uppercase;}
#player[data-phase="rest"] .pl-target, #player[data-phase="prep"] .pl-target, #player[data-timed="1"][data-phase="work"] .pl-target{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.pl-cues{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-wrap:wrap; justify-content:center; gap:6px 8px;}
.pl-cues li{font-size:13px; color:var(--chalk); background:rgba(241,243,236,0.07); padding:5px 10px; border-radius:100px;}
.timerbar{height:6px; border-radius:3px; background:rgba(241,243,236,0.1); margin:12px auto 0; max-width:280px; overflow:hidden;}
.timerbar i{display:block; height:100%; background:var(--grad); transform-origin:left;}
.pl-controls{padding:14px 0 8px;}
.row{display:flex; gap:10px; align-items:center;}
.row > *{flex:1;}
.stepper{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px;}
.stepper button{width:56px; height:48px; border-radius:14px; border:1.5px solid var(--line-2); font-size:26px; font-weight:500; line-height:1; flex:0 0 auto;}
.stepper .val{min-width:110px; text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--dim);}
.stepper .val b{display:block; font-family:var(--display); font-size:26px; color:var(--chalk); font-weight:600; letter-spacing:0;}
.big-btn{min-height:64px; font-size:19px; border-radius:18px;}
.effort{margin:0 0 12px; text-align:center;}
.effort .q{font-size:13px; color:var(--dim); margin-bottom:8px;}
.effort .row button{min-height:44px; border-radius:12px; border:1.5px solid var(--line-2); font-weight:600; font-size:14px;}
.effort .row button[aria-pressed="true"]{background:var(--chalk); color:var(--bg); border-color:var(--chalk);}
.pl-next{display:flex; align-items:center; gap:12px; padding:10px 16px calc(10px + var(--safe-b)); border-top:1px solid var(--line); max-width:640px; width:100%; margin:0 auto;}
.pl-next .thumb{flex-basis:40px; height:40px;}
.pl-next .thumb svg{width:34px; height:34px;}
.pl-next .txt{flex:1; min-width:0;}
.pl-next .l{font-family:var(--mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--dim);}
.pl-next .n{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.paused-veil{position:absolute; inset:0; z-index:5; background:rgba(12,18,16,0.86); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center;
  backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);}
.paused-veil h2{font-family:var(--display); font-size:36px; letter-spacing:3px; text-transform:uppercase;}
.paused-veil p{color:var(--dim); font-size:14px;}
.paused-veil .btns{display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; margin-top:10px;}
@media (max-height:720px){
  .pl-target{font-size:46px;}
  .pl-cues li:nth-child(n+3){display:none;}
  .big-btn{min-height:58px;}
  .stepper{margin-bottom:8px;}
  .pl-info{padding-top:8px;}
}
@media (max-height:620px){ .pl-cues{display:none;} }

/* ================= summary ================= */
.done-mark{width:76px; height:76px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; margin:12px auto 0; animation:pop 600ms var(--spring) both;}
.done-mark.partial{background:var(--s3); color:var(--chalk); font-size:18px;}
.done-mark svg{width:38px; height:38px; fill:none; stroke:#1A140F; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
@keyframes pop{0%{transform:scale(0.4); opacity:0;} 100%{transform:none; opacity:1;}}
.sm-title{font-family:var(--display); font-weight:700; font-size:34px; text-transform:uppercase; text-align:center; margin-top:14px; letter-spacing:0.5px;}
.sm-sub{text-align:center; color:var(--dim); margin-top:4px;}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px;}
.stat{background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px;}
.stat .v{font-family:var(--display); font-weight:600; font-size:30px; line-height:1.1; font-variant-numeric:tabular-nums;}
.stat .v small{font-size:15px; color:var(--dim); margin-left:4px;}
.stat .k{font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); margin-top:2px;}
.section-h{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim); margin:26px 4px 10px;}
.card{background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:4px 14px;}
.li{display:flex; align-items:center; gap:12px; padding:11px 0; min-height:52px;}
.li + .li{border-top:1px solid var(--line);}
.li .txt{flex:1; min-width:0;}
.li .t1{font-weight:600; font-size:14.5px;}
.li .t2{font-size:12.5px; color:var(--dim); margin-top:1px;}
.badge{font-family:var(--mono); font-size:11px; font-weight:600; padding:3px 8px; border-radius:7px; white-space:nowrap;}
.badge.ok{background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok);}
.badge.part{background:rgba(241,243,236,0.08); color:var(--dim);}
.rec-icon{flex:0 0 36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--grad); color:#1A140F; font-family:var(--display); font-weight:700; font-size:14px;}

/* ================= history ================= */
.hist-stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
.hist-stats .stat{padding:12px 12px;}
.hist-stats .v{font-size:26px;}
.empty{padding:30px 18px; text-align:center; color:var(--dim); background:var(--s1); border-radius:var(--r); border:1px dashed var(--line-2);}
.link-card{display:flex; align-items:center; gap:12px; padding:16px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line); text-decoration:none; margin-top:18px;}
.link-card .txt{flex:1;}
.link-card .t2{color:var(--dim); font-size:13px;}

/* ================= sheets ================= */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(8,12,10,0.62); opacity:0; pointer-events:none; transition:opacity 220ms ease;}
.scrim.show{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; max-height:90vh; max-height:90dvh; overflow:auto; overscroll-behavior:contain; background:var(--s1); border-radius:24px 24px 0 0;
  padding:10px 18px calc(20px + var(--safe-b)); transform:translateY(105%); visibility:hidden; transition:transform 320ms var(--out), visibility 0s linear 320ms; max-width:640px; margin:0 auto; border:1px solid var(--line); border-bottom:0;}
.sheet.show{transform:none; visibility:visible; transition:transform 320ms var(--out);}
.sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--line-2); margin:0 auto 14px;}
.sheet h2{font-family:var(--display); font-weight:600; font-size:22px; text-transform:uppercase; letter-spacing:0.8px;}
.sheet .lead{color:var(--dim); margin-top:6px; font-size:14px;}
.sheet .stack{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
.field{margin-top:22px;}
.field > .eyebrow{display:block; margin-bottom:10px;}
.seg{display:grid; grid-template-columns:repeat(var(--n, 3), 1fr); gap:4px; background:var(--bg-deep); padding:4px; border-radius:14px;}
.seg button{min-height:44px; border-radius:10px; font-weight:600; font-size:13px; color:var(--dim); padding:0 4px;}
.seg button[aria-pressed="true"]{background:var(--s3); color:var(--chalk);}
.toggle{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:12px 2px; min-height:56px;}
.toggle + .toggle{border-top:1px solid var(--line);}
.toggle .txt{flex:1;}
.toggle .t1{font-weight:600; font-size:14.5px;}
.toggle .t2{color:var(--dim); font-size:12.5px;}
.sw{flex:0 0 46px; height:28px; border-radius:20px; background:rgba(241,243,236,0.16); position:relative; transition:background 200ms ease;}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--chalk); transition:transform 220ms var(--out);}
.toggle[aria-checked="true"] .sw{background:var(--sun);}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px);}
.ex-stage{height:min(42vh, 300px); border-radius:var(--r); background:var(--bg-deep); display:flex; align-items:center; justify-content:center; margin-top:14px; padding:10px;}
.ex-stage svg{height:100%; width:100%; max-width:320px; overflow:visible;}
.ex-cue{margin-top:14px; font-size:14.5px;}
.ex-cues{margin:10px 0 0; padding-left:18px; color:var(--dim); font-size:14px;}

/* ================= onboarding ================= */
#onboard .wrap{padding-bottom:calc(130px + var(--safe-b));}
.ob-dots{display:flex; gap:6px;}
.ob-dots i{width:24px; height:4px; border-radius:2px; background:var(--line-2);}
.ob-dots i.on{background:var(--grad);}
.ob-q{font-family:var(--display); font-weight:600; font-size:30px; line-height:1.08; text-transform:uppercase; margin-top:12px;}
.ob-help{color:var(--dim); margin-top:8px;}
.choices{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
.choice{display:flex; gap:14px; align-items:center; text-align:left; padding:14px 16px; border-radius:var(--r); border:1.5px solid var(--line-2); background:var(--s1); min-height:64px;}
.choice .t1{font-weight:600; font-size:16px;}
.choice .t2{color:var(--dim); font-size:13px; margin-top:2px;}
.choice .txt{flex:1;}
.choice .tick{flex:0 0 24px; height:24px; border-radius:50%; border:2px solid var(--line-2); display:flex; align-items:center; justify-content:center;}
.choice[aria-pressed="true"]{border-color:var(--sun); background:color-mix(in srgb, var(--sun) 9%, var(--s1));}
.choice[aria-pressed="true"] .tick{background:var(--sun); border-color:var(--sun);}
.choice[aria-pressed="true"] .tick::after{content:""; width:8px; height:8px; border-radius:50%; background:#1A140F;}
.note{margin-top:14px; padding:12px 14px; border-radius:12px; background:rgba(241,243,236,0.05); color:var(--dim); font-size:13px;}

/* figure (js/figure.js draws it) */
.fig path{fill:none; stroke:var(--chalk); stroke-width:5; stroke-linecap:round; stroke-linejoin:round;}
.fig .head{fill:var(--chalk);}
.fig .far{opacity:0.42;}
.fig .floor{stroke:var(--dim); stroke-width:1.5; opacity:0.45; stroke-linecap:butt;}
.fig .floor.ticks{stroke-dasharray:4 4; opacity:0.7;}
.fig .bar{stroke:var(--dim); stroke-width:2; opacity:0.7;}
.fig .mat{fill:none; stroke:var(--dim); stroke-width:1.5; opacity:0.45;}
.thumb .fig path{stroke-width:6.5;}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(100px + var(--safe-b)); z-index:80; transform:translate(-50%, 12px); opacity:0; pointer-events:none;
  background:var(--chalk); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:500; font-size:14px; max-width:calc(100% - 32px); width:max-content; box-shadow:0 10px 30px -10px rgba(0,0,0,0.8);
  transition:opacity 200ms ease, transform 280ms var(--out);}
.toast.show{opacity:1; transform:translate(-50%, 0);}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:1ms !important; animation-iteration-count:1 !important; transition-duration:1ms !important;}
}
@media (min-width:700px){ .wrap{padding-top:calc(28px + var(--safe-t));} }
@media (max-width:350px){
  .time-num{font-size:80px;}
  .presets{gap:6px;}
  .preset{font-size:13px;}
}
</style>

<body>

<!-- ========== onboarding ========== -->
<section id="onboard" class="screen" aria-label="Set up"></section>

<!-- ========== home ========== -->
<section id="home" class="screen" aria-label="Home">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Calisthenics</div>
      <div class="actions">
        <button class="icon-btn press" id="history-btn" aria-label="Training history"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg></button>
        <button class="icon-btn press" id="settings-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </div>
    <div id="resume-slot"></div>
    <div class="hero">
      <h1>Your time.<br><span>Your workout.</span></h1>
      <p>Tell us how much time you have. We'll handle the rest.</p>
    </div>
    <div class="timecard">
      <span class="eyebrow">Time available today</span>
      <div class="time-readout"><span class="time-num" id="minutes">20</span><span class="time-unit">min</span></div>
      <input class="range" id="time-slider" type="range" min="0" max="43" step="1" value="15" aria-label="Workout length in minutes" aria-valuetext="20 minutes">

  <div class="cta"><button class="btn btn-primary press" id="start-btn">Start workout</button></div>
</section>

<!-- ========== full plan ========== -->
<section id="plan" class="screen" aria-label="Workout plan">
  <div class="wrap">
    <div class="subhead"><button class="icon-btn press" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Today's plan</h2></div>
    <div id="plan-body"></div>
  </div>
  <div class="cta"><button class="btn btn-primary press" id="plan-start">Start workout</button></div>
</section>

<!-- ========== player ========== -->
<section id="player" class="screen" aria-label="Workout">
  <div class="pl-top">
    <button class="icon-btn press" id="pl-close" aria-label="Pause and show options"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="pl-prog"><div class="pl-bar" id="pl-bar" aria-hidden="true"></div><div class="pl-meta"><span id="pl-block"></span><span id="pl-left" class="mono"></span></div></div>
    <button class="icon-btn press" id="pl-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  </div>
  <div class="pl-main">
    <div class="pl-stage" id="pl-stage"></div>
    <div class="pl-info">
      <div class="pl-kicker" id="pl-kicker" aria-live="polite"></div>
      <h1 class="pl-name" id="pl-name"></h1>
      <div class="pl-target" id="pl-target"></div>
      <div class="timerbar" id="pl-timerbar" hidden><i></i></div>
      <ul class="pl-cues" id="pl-cues"></ul>
    </div>
    <div class="pl-controls" id="pl-controls"></div>
  </div>

    <h2>Paused</h2>
    <p id="pl-paused-sub"></p>
    <div class="btns">
      <button class="btn btn-primary big-btn press" id="pl-resume">Resume</button>
      <button class="btn btn-ghost press" id="pl-swap">Swap exercise</button>
      <button class="btn btn-ghost press" id="pl-skipex">Skip this exercise</button>
      <button class="btn btn-danger press" id="pl-end">End workout</button>
    </div>

</section>

<!-- ========== summary ========== -->
<section id="summary" class="screen" aria-label="Workout summary"><div class="wrap" id="summary-body"></div>
  <div class="cta"><button class="btn btn-primary press" id="sm-done">Done</button></div>
</section>

<!-- ========== history ========== -->
<section id="history" class="screen" aria-label="History">
  <div class="wrap">
    <div class="subhead"><button class="icon-btn press" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Your training</h2></div>
    <div id="history-body"></div>
  </div>
